{"c":"signs","s":"tunnel","q":"What does this warning sign mean?","o":["Tunnel ahead","Low bridge ahead","An underpass for pedestrians","A humpback bridge"],"a":0,"e":"Take off sunglasses, switch on dipped headlights, tune to any announced radio channel and keep a safe gap."},
{"c":"signs","s":"ford","q":"What does this warning sign mean?","o":["A ford, where water crosses the road","Risk of flooding from the river","A quayside or river bank","Slippery road ahead"],"a":0,"e":"Check the depth gauge first, cross slowly in a low gear with the revs up, then dry your brakes on the far side."},
{"c":"signs","s":"low_bridge","q":"What does this sign mean?","o":["A low bridge with the headroom shown","A tunnel with a height limit","An arched footbridge ahead","A bridge with a weight limit"],"a":0,"e":"Know your vehicle's height. Bridge strikes are usually caused by drivers who never checked."},
{"c":"signs","s":"side_wind","q":"What does this warning sign mean?","o":["Risk of strong side winds","An airfield ahead","A weather station","A flag-marked diversion"],"a":0,"e":"Grip the wheel firmly and expect a shove as you pass a gap in a hedge, a bridge or a high-sided vehicle."},
{"c":"signs","s":"trams","q":"What does this warning sign mean?","o":["Trams crossing ahead","A railway station ahead","Buses only","A level crossing with a barrier"],"a":0,"e":"Trams run on fixed rails and can't steer round you. The rails themselves are slippery for two-wheelers."},
{"c":"signs","s":"cyclists_warn","q":"What does this warning sign mean?","o":["Cycle route ahead, or cyclists crossing","A cycle route you must use","No cycling","Cycle hire available"],"a":0,"e":"A triangle warns; the blue circle with a bicycle is the one that gives an instruction."},
{"c":"signs","s":"queues","q":"What does this warning sign mean?","o":["Queues likely ahead","A car park ahead","Slow-moving traffic","A traffic survey ahead"],"a":0,"e":"Slow early and consider a brief flash of hazard lights to warn the driver behind you."},
{"c":"signs","s":"merge_left","q":"What does this warning sign mean?","o":["Traffic merging from the left","The road narrows on the left","A side road on the left","A left-hand bend"],"a":0,"e":"Neither road has automatic priority at a merge, so adjust your speed and let traffic filter in."},
{"c":"signs","s":"dual_ends","q":"What does this warning sign mean?","o":["The dual carriageway ends ahead","Two-way traffic crosses ahead","The road widens","A contraflow system ahead"],"a":0,"e":"Get into the left-hand lane in good time. Once it ends you'll be facing oncoming traffic again."},
{"c":"signs","s":"opening_bridge","q":"What does this warning sign mean?","o":["An opening or swing bridge ahead","A bridge with a weight limit","Roadworks on a bridge","A humpback bridge"],"a":0,"e":"You may be held for several minutes while it opens for a boat. Switch off your engine while you wait."},
{"c":"signs","s":"no_right_turn","q":"What does this sign mean?","o":["No right turn","No left turn","No U-turns","Right turn ahead"],"a":0,"e":"A red ring with a red diagonal through the symbol means the manoeuvre is banned. Find another route round."},
{"c":"signs","s":"no_left_turn","q":"What does this sign mean?","o":["No left turn","No right turn","Keep left","One-way to the right"],"a":0,"e":"Common where a side street is one-way against you or too narrow for turning traffic."},
{"c":"signs","s":"limit_30","q":"What does this sign mean?","o":["Maximum speed 30mph","Minimum speed 30mph","Recommended speed 30mph","30 metres to the junction"],"a":0,"e":"A red ring is a prohibition — you must not exceed it. The blue circle version is a minimum speed."},
{"c":"signs","s":"limit_20","q":"What does this sign mean?","o":["Maximum speed 20mph","Advisory speed 20mph","Minimum speed 20mph","Zone ends in 20 metres"],"a":0,"e":"Common outside schools and in residential zones. A pedestrian hit at 20mph is far more likely to survive than one hit at 30."},
{"c":"signs","s":"no_vehicles","q":"What does this sign mean?","o":["No vehicles of any kind","No entry","End of all restrictions","No waiting"],"a":0,"e":"A plain red ring bans all vehicles, though a plate may make exceptions such as access or bicycles."},
{"c":"signs","s":"no_goods","q":"What does this sign mean?","o":["No goods vehicles over the weight shown on the plate","No parking for lorries","Lorry route ahead","Weighbridge ahead"],"a":0,"e":"Used to keep heavy vehicles off unsuitable roads and away from weak bridges."},
{"c":"signs","s":"height_limit","q":"What does this sign mean?","o":["No vehicles over the height shown","No vehicles over the width shown","A low bridge in that distance","Maximum headroom advised"],"a":0,"e":"A red ring means you must not pass it. Check your vehicle's height before you commit, especially with a roof box or a van."},
{"c":"signs","s":"turn_right","q":"What does this sign mean?","o":["Turn right ahead","Keep right","Bend to the right","One-way to the right"],"a":0,"e":"Blue circle, white symbol: something you must do. You can't go straight on or turn left here."},
{"c":"signs","s":"keep_right","q":"What does this sign mean?","o":["Keep right","Turn right ahead","Overtake on the right only","Traffic merges from the right"],"a":0,"e":"Usually on a traffic island. The mirrored version, keep left, is far more common in the UK."},
{"c":"signs","s":"mini_rbt","q":"What does this sign mean?","o":["Mini-roundabout — give way to traffic from the right","Roundabout ahead","A one-way system","Turn right only"],"a":0,"e":"It's a blue circle, so it's an order. Pass round the central marking unless your vehicle is too long to do so."},
{"c":"signs","s":"no_peds","q":"What does this sign mean?","o":["No pedestrians","Pedestrian crossing ahead","Pedestrians in the road ahead","A pedestrian zone"],"a":0,"e":"Used on roads that are dangerous to walk on, such as some slip roads and tunnels."},
{"c":"signs","s":"no_through_road","q":"What does this sign mean?","o":["No through road","No entry","T-junction ahead","No right turn"],"a":0,"e":"A dead end. If it's on a side road as you pass, it tells you not to bother turning in."},
{"c":"signs","s":"priority_over","q":"What does this sign mean?","o":["You have priority over oncoming vehicles","Oncoming vehicles have priority over you","Two-way traffic ahead","No overtaking"],"a":0,"e":"The white arrow is your direction of travel. Even with priority, don't force through if someone has already committed."},
{"c":"signs","s":"give_way_oncoming","q":"What does this sign mean?","o":["Give priority to oncoming vehicles","You have priority over oncoming vehicles","No entry for oncoming traffic","Two-way traffic ahead"],"a":0,"e":"The red arrow shows the direction with priority — and it isn't yours. Wait until the way is clear."},
{"c":"signs","s":"parking_P","q":"What does this sign mean?","o":["Parking is available","No parking","A park and ride","A private car park"],"a":0,"e":"Blue rectangle, so it's information. Any plate underneath sets out the hours, charges or who it's reserved for."},
{"c":"signs","s":"hospital","q":"What does this sign mean?","o":["A hospital ahead with an accident and emergency department","A first aid post","A doctor's surgery","A helicopter landing site"],"a":0,"e":"Keep your speed down and your noise down near hospital entrances, and watch for ambulances turning in."},

{"c":"signs","oi":true,"q":"Which sign means you must stop and give way?","o":["stop","give_way","no_entry","no_vehicles"],"a":0,"e":"The octagon is unique so it stays recognisable even if it's covered in snow or graffiti."},
{"c":"signs","oi":true,"q":"Which sign tells you the national speed limit applies?","o":["national_speed","no_vehicles","no_overtaking","limit_30"],"a":0,"e":"60mph on a single carriageway, 70 on a dual carriageway or motorway. It isn't an instruction to speed up."},
{"c":"signs","oi":true,"q":"Which sign means no entry for vehicles?","o":["no_entry","no_vehicles","no_stopping","stop"],"a":0,"e":"Usually the exit of a one-way street. Passing it means driving into oncoming traffic."},
{"c":"signs","oi":true,"q":"Which sign warns of a roundabout ahead?","o":["roundabout","mini_rbt","double_bend","merge_left"],"a":0,"e":"The triangle warns you one is coming; the blue circle is the mini-roundabout order itself."},
{"c":"signs","oi":true,"q":"Which sign means no overtaking?","o":["no_overtaking","two_way","no_motor","priority_over"],"a":0,"e":"It applies until an 'end of no overtaking' sign, and a red ring always means something you must not do."},
{"c":"signs","oi":true,"q":"Which sign warns that the road is slippery?","o":["slippery","uneven","loose_chippings","humps"],"a":0,"e":"The skid marks behind the car are the giveaway. Avoid harsh braking or steering until you're past."},
{"c":"signs","oi":true,"q":"Which sign warns of a level crossing without a barrier?","o":["lc_no_barrier","lc_barrier","trams","opening_bridge"],"a":0,"e":"The locomotive means there's nothing physical to stop you. Obey the lights absolutely."},
{"c":"signs","oi":true,"q":"Which sign means you must turn left ahead?","o":["turn_left","keep_left","no_left_turn","bend_left"],"a":0,"e":"Blue circle with a bent arrow. The diagonal arrow version means keep left, which is a different instruction."},
{"c":"signs","oi":true,"q":"Which sign warns of children near the road?","o":["children","ped_crossing","no_peds","cyclists_warn"],"a":0,"e":"Look for a plate giving school hours, and expect children to run out between parked cars."},
{"c":"signs","oi":true,"q":"Which sign means no stopping at any time?","o":["no_stopping","no_waiting","no_entry","no_vehicles"],"a":0,"e":"The red cross on blue is a clearway. The single diagonal means no waiting, which still allows a brief set-down."},
{"c":"signs","oi":true,"q":"Which sign warns of a steep hill downwards?","o":["hill_down","hill_up","uneven","humps"],"a":0,"e":"The slope falls away to the right, matching your direction of travel. Choose a lower gear before you start down."},
{"c":"signs","oi":true,"q":"Which sign warns of a tunnel ahead?","o":["tunnel","low_bridge","opening_bridge","narrows"],"a":0,"e":"Remove sunglasses, put dipped headlights on and keep your distance."},
{"c":"signs","oi":true,"q":"Which sign means no motor vehicles?","o":["no_motor","no_goods","no_vehicles","no_cycling"],"a":0,"e":"Shows both a car and a motorcycle. Bicycles may still use the road."},
{"c":"signs","oi":true,"q":"Which sign warns of cattle in the road?","o":["cattle","wild_animals","children","trams"],"a":0,"e":"Slow right down and pass quietly. Never use the horn near livestock."},
{"c":"signs","oi":true,"q":"Which sign warns of wild animals crossing?","o":["wild_animals","cattle","children","falling_rocks"],"a":0,"e":"Deer are most active at dawn and dusk, and rarely cross alone."},
{"c":"signs","oi":true,"q":"Which sign means a maximum speed of 20mph?","o":["limit_20","limit_30","min_speed","national_speed"],"a":0,"e":"A red ring is a limit you must not exceed. The blue circle with a number is a minimum speed instead."},
{"c":"signs","oi":true,"q":"Which sign means minimum speed?","o":["min_speed","limit_30","limit_20","mini_rbt"],"a":0,"e":"Blue circles give positive instructions. A red diagonal through it marks the end of that requirement."},
{"c":"signs","oi":true,"q":"Which sign warns that traffic merges from the left?","o":["merge_left","narrows_right","dual_ends","bend_left"],"a":0,"e":"Neither stream has automatic priority, so adjust your speed and let people in."},
{"c":"signs","oi":true,"q":"Which sign means no right turn?","o":["no_right_turn","no_left_turn","no_uturn","turn_right"],"a":0,"e":"Red ring and a red diagonal through a right-turn arrow. The blue version is the order to turn right."},
{"c":"signs","oi":true,"q":"Which sign means you must not make a U-turn?","o":["no_uturn","no_right_turn","no_left_turn","no_entry"],"a":0,"e":"A U-shaped arrow struck through. Carry on and find a safe place to turn instead."},
{"c":"signs","oi":true,"q":"Which sign warns of falling rocks?","o":["falling_rocks","loose_chippings","uneven","roadworks"],"a":0,"e":"Watch for debris already on the carriageway as well as anything still coming down."},
{"c":"signs","oi":true,"q":"Which sign warns of roadworks ahead?","o":["roadworks","falling_rocks","loose_chippings","queues"],"a":0,"e":"Expect lower limits, lane closures and people working close to live traffic."},
{"c":"signs","oi":true,"q":"Which sign warns of a road hump?","o":["humps","uneven","hill_up","loose_chippings"],"a":0,"e":"Hold a steady low speed through the whole section rather than braking at each one."},
{"c":"signs","oi":true,"q":"Which sign gives priority to you over oncoming vehicles?","o":["priority_over","give_way_oncoming","two_way","one_way"],"a":0,"e":"The white arrow is you. Even so, don't force through if an oncoming driver has already committed."},
{"c":"signs","oi":true,"q":"Which sign means you must give way to oncoming vehicles?","o":["give_way_oncoming","priority_over","give_way","two_way"],"a":0,"e":"The red arrow points the way that has priority, and it's pointing at you."},
{"c":"signs","oi":true,"q":"Which sign warns of strong side winds?","o":["side_wind","opening_bridge","trams","queues"],"a":0,"e":"The windsock is the clue. Give motorcyclists and high-sided vehicles a wide berth."},
{"c":"signs","oi":true,"q":"Which sign marks a route for cycles only?","o":["cycle_route","cyclists_warn","no_cycling","no_motor"],"a":0,"e":"Blue circle means mandatory. The red-ringed bicycle bans cycling instead."},
{"c":"signs","oi":true,"q":"Which sign means no pedestrians?","o":["no_peds","ped_crossing","children","no_cycling"],"a":0,"e":"Found where walking would be dangerous, such as some tunnels and slip roads."},
{"c":"signs","oi":true,"q":"Which sign tells you there's a hospital ahead?","o":["hospital","parking_P","no_through_road","priority_over"],"a":0,"e":"Blue rectangles inform. Keep speed and noise down near the entrance and watch for ambulances."},
{"c":"signs","oi":true,"q":"Which sign means no through road?","o":["no_through_road","no_entry","parking_P","priority_over"],"a":0,"e":"A dead end. On a side road it saves you turning in and having to reverse back out."},
{"c":"signs","oi":true,"q":"Which sign warns of a double bend, first to the left?","o":["double_bend","bend_left","bend_right","merge_left"],"a":0,"e":"The shape of the symbol mirrors the shape of the road ahead."},
{"c":"signs","oi":true,"q":"Which sign warns that the dual carriageway ends?","o":["dual_ends","narrows","merge_left","two_way"],"a":0,"e":"Move into the left lane in good time — you'll shortly be facing oncoming traffic."},
{"c":"signs","oi":true,"q":"Which sign warns of a ford?","o":["ford","uneven","opening_bridge","slippery"],"a":0,"e":"Check the depth gauge, cross slowly in a low gear, then dry your brakes on the far side."},
{"c":"signs","oi":true,"q":"Which sign means you must keep left?","o":["keep_left","keep_right","turn_left","ahead_only"],"a":0,"e":"Normally on a traffic island or the nose of a central reservation."},
{"c":"signs","oi":true,"q":"Which sign means ahead only?","o":["ahead_only","keep_left","priority_over","one_way"],"a":0,"e":"Blue circle with a straight white arrow — an order, not information. You can't turn off here."},
{"c":"signs","oi":true,"q":"Which sign warns of traffic signals ahead?","o":["signals","lc_barrier","roadworks","queues"],"a":0,"e":"Useful where the lights are hidden by a bend or a crest. Expect to stop."},
{"c":"signs","oi":true,"q":"Which sign means no vehicles over the height shown?","o":["height_limit","weight_limit","low_bridge","no_goods"],"a":0,"e":"The red ring makes it an order. The triangle version is only a warning of the bridge ahead."},
{"c":"signs","oi":true,"q":"Which sign bans goods vehicles over the weight shown?","o":["no_goods","weight_limit","no_motor","no_vehicles"],"a":0,"e":"The lorry symbol limits goods vehicles specifically; the plain weight sign applies to all vehicles."},
{"c":"signs","oi":true,"q":"Which sign warns of an uneven road surface?","o":["uneven","humps","loose_chippings","slippery"],"a":0,"e":"A rough surface unsettles the car and is genuinely dangerous for motorcyclists."},
{"c":"signs","oi":true,"q":"Which sign warns of queues ahead?","o":["queues","merge_left","roadworks","dual_ends"],"a":0,"e":"Slow early. A short burst of hazard lights warns the driver behind you before they arrive too fast."},

{"c":"signs","q":"What do double white lines along the middle of the road mean when the line nearest you is broken?","o":["You may cross to overtake if the road ahead is clear","You must not cross at all","Overtaking is compulsory","The road ahead is one-way"],"a":0,"e":"Broken line nearest you means you may cross if it's safe. Solid line nearest you means you generally must not."},
{"c":"signs","q":"What does a row of raised studs with a solid white line at the edge of the carriageway warn you of?","o":["That you're drifting off the running lane","That the road is about to narrow","That there's a cycle lane","That a junction is coming"],"a":0,"e":"The rumble is deliberate — it wakes tired drivers and warns you in poor visibility."},
{"c":"signs","q":"What colour are reflective studs between the lanes of a motorway?","o":["White","Red","Amber","Green"],"a":0,"e":"White between lanes, red on the left edge, amber on the right, green across slip roads."},
{"c":"signs","q":"What do red reflective studs on a motorway mark?","o":["The left-hand edge of the carriageway","The central reservation","A slip road","A lane closure"],"a":0,"e":"If you see red studs on your right, you're going the wrong way. Stop and get help immediately."},
{"c":"signs","q":"What does a yellow box junction with criss-cross lines mean?","o":["Don't enter until your exit is clear","Give way to traffic from the right","Stop and wait for a signal","Parking is permitted"],"a":0,"e":"The only exception is turning right, where you may wait in the box if you're only held up by oncoming traffic."},
{"c":"signs","q":"What does a white triangle painted on the road surface mean?","o":["Give way to traffic on the major road ahead","Stop at the line ahead","A pedestrian crossing ahead","The road narrows"],"a":0,"e":"It's the give way warning marking, usually painted before the broken give way line itself."},
{"c":"signs","q":"What does a long white line with short gaps in the centre of the road mean?","o":["A hazard warning line — don't cross unless the road is clear","The road is one-way","It marks a bus lane","Overtaking is banned"],"a":0,"e":"Longer marks than gaps always means extra caution: a bend, a junction or a hidden hazard."},
{"c":"signs","q":"What does a single yellow line at the kerb mean?","o":["No waiting during the times shown on the nearby plate","No waiting at any time","No stopping at any time","Loading only"],"a":0,"e":"Always find the plate on the nearest post — the hours vary from street to street."},
{"c":"signs","q":"What do yellow marks painted at right angles across the kerb mean?","o":["Loading and unloading are restricted","Parking is free","A bus stop","A taxi rank"],"a":0,"e":"One kerb blip means restricted at certain times, two means no loading at any time. Check the plate."},
{"c":"signs","q":"What does a broken white line across the mouth of a junction you're approaching mean?","o":["Give way to traffic on the major road","Stop completely before emerging","You have priority","The junction is closed"],"a":0,"e":"Slow enough that you can stop, and only emerge when you won't make anyone else change speed or direction."},
{"c":"signs","q":"What does a green traffic light with a green arrow pointing right mean?","o":["You may go in the direction of the arrow, even if the main light is red","You must turn right","Give way before turning right","The lights are faulty"],"a":0,"e":"A filter arrow gives you a protected turn. Don't use it to go any other way."},
{"c":"signs","q":"What does red and amber showing together at traffic lights mean?","o":["Wait — don't go until green shows","Go if the road is clear","Stop immediately","The lights are changing to red"],"a":0,"e":"It's a warning that green is coming, not permission. Moving off on red and amber is an offence."},
{"c":"signs","q":"A police officer is directing traffic and signals you to stop. What must you do?","o":["Obey the officer, even if the lights are green","Obey the traffic lights instead","Stop only if the lights are red","Sound your horn and proceed"],"a":0,"e":"Signals from a police officer, traffic warden or school crossing patrol override lights and signs."},
{"c":"signs","q":"What does an arm extended straight out from a cyclist's right side mean?","o":["They intend to turn right","They intend to slow down","They want you to overtake","They're about to stop"],"a":0,"e":"Give them room and don't overtake until they've completed the turn."},
{"c":"signs","q":"What does a flashing amber light above a motorway lane mean?","o":["There's a hazard ahead — slow to the speed shown","The lane is closed","The motorway ends","Traffic is diverted"],"a":0,"e":"The limit applies until you pass a signal cancelling it, even if you can't see the hazard yet."},
{"c":"signs","q":"What colour is the background of a sign directing you to a primary route?","o":["Green","Blue","White","Brown"],"a":0,"e":"Blue for motorways, green for primary routes, white with black borders for local roads, brown for tourist attractions."},
{"c":"signs","q":"What does a sign with a black arrow and a distance on a white background at the roadside usually indicate?","o":["A local route and how far it is","A motorway junction","A diversion for lorries","A dead end"],"a":0,"e":"White signs with black borders cover non-primary local roads."},
{"c":"signs","q":"What does a black and white striped post with a red reflector beside a level crossing show?","o":["The distance to the crossing as you approach","The height of the bridge","Where to park","The direction of the nearest phone"],"a":0,"e":"Three stripes, then two, then one — a countdown to the crossing itself."},
{"c":"signs","q":"What does a sign showing a black cross on a white background at a level crossing mean?","o":["A crossing with no gate or barrier","The crossing is closed","Trams cross here","The barrier is broken"],"a":0,"e":"Treat it with extreme care. If there are lights, obey them absolutely; if not, look and listen before crossing."},
{"c":"signs","q":"What does a white circular sign showing a black diagonal line through a red '30' ring mean?","o":["The end of the 30mph limit — national limits now apply","A recommended speed of 30mph","A minimum speed of 30mph","The start of a 30mph zone"],"a":0,"e":"The diagonal cancels the restriction. Check what limit now applies before you accelerate."},
{"c":"signs","q":"What does a rectangular sign showing a bus and a bicycle with times beneath mean?","o":["A lane reserved for those vehicles during the hours shown","No buses or cycles allowed","A bus stop and cycle stand","A bus station ahead"],"a":0,"e":"Outside those hours you may use the lane. Inside them, check whether taxis or motorcycles are included."},
{"c":"signs","q":"What does the sign 'Red Route — no stopping' mean?","o":["You must not stop at all on the main carriageway","You may stop for up to two minutes","Only red vehicles are restricted","Stopping is allowed outside rush hour"],"a":0,"e":"Red routes are enforced by camera and the penalties are higher than for yellow lines."},
{"c":"signs","q":"What does a temporary yellow and black sign at roadworks showing a lane layout tell you?","o":["How the lanes are arranged through the works","That the road is closed","That the limit no longer applies","Where to park"],"a":0,"e":"Get into the correct lane early. Merging in turn at the point of closure keeps the queue moving."},
{"c":"signs","q":"What does a sign showing a lorry on a steep gradient with a plate reading 'escape lane' mean?","o":["There's a gravel arrester bed for vehicles with brake failure","Lorries must use that lane","A lorry park ahead","A weight limit ahead"],"a":0,"e":"Never park or stop in one — a runaway vehicle may need it at any moment."},
{"c":"signs","q":"What does a blue sign with a white 'M' and a number mean?","o":["The motorway that number refers to","A minimum speed limit","A motorway service area","A diversion route"],"a":0,"e":"Blue is always motorway. A motorway number on a green sign means the motorway starts further along that route."},
{"c":"signs","q":"What does a sign with a black and white chevron pattern on a bend mean?","o":["A sharp deviation in the direction shown by the chevrons","No overtaking","Road closed ahead","Pedestrians ahead"],"a":0,"e":"The more chevrons you see, the sharper the change of direction. Slow before you reach them."},
{"c":"rules","q":"What's the speed limit in a signed 20mph zone?","o":["20mph, and it applies to the whole zone without repeater signs","20mph only where repeaters are shown","An advisory 20mph","20mph only during school hours"],"a":0,"e":"Zones are usually backed by humps or other calming, so the whole area is covered by the entry sign alone."},
{"c":"rules","q":"You're towing a trailer on a single carriageway. What's your speed limit?","o":["50mph","60mph","40mph","70mph"],"a":0,"e":"Towing limits are 50 on a single carriageway and 60 on dual carriageways and motorways, unless a lower limit is signed."},
{"c":"rules","q":"What's the national speed limit for a goods vehicle over 7.5 tonnes on a dual carriageway in England?","o":["60mph","70mph","50mph","56mph"],"a":0,"e":"Heavy goods vehicles are limited to 50 on single carriageways and 60 on dual carriageways and motorways."},
{"c":"rules","q":"May you stop on the zigzag lines approaching a pedestrian crossing?","o":["No, not even to drop someone off","Yes, briefly","Yes, if no pedestrians are waiting","Yes, outside rush hour"],"a":0,"e":"The zigzags exist to keep the crossing visible. Stopping or overtaking there hides pedestrians from other drivers."},
{"c":"rules","q":"When may you cross a solid white line in the centre of the road?","o":["To pass a cyclist, horse or road maintenance vehicle travelling under 10mph","Whenever the road ahead is clear","To overtake any slow vehicle","Only in an emergency"],"a":0,"e":"You may also cross it to enter premises or a side road, or to pass a stationary vehicle blocking your lane."},
{"c":"rules","q":"What do chevron markings bordered by a solid white line mean?","o":["You must not enter the area except in an emergency","You may cross if the road is clear","Parking is permitted there","It marks a cycle lane"],"a":0,"e":"Where the border is broken instead, you may enter the area if it's necessary and safe to do so."},
{"c":"rules","q":"You're in the left lane of a roundabout and want the third exit. What should you normally do?","o":["Approach in the right-hand lane and signal right until you pass the exit before yours","Stay left and signal right","Use the left lane and signal left throughout","Use whichever lane is emptier"],"a":0,"e":"Signal left after the exit before the one you want, and check your left mirror and blind spot for cyclists before leaving."},
{"c":"rules","q":"When should you signal left at a roundabout?","o":["After passing the exit before the one you want","As you enter the roundabout","Only if traffic is behind you","Not at all"],"a":0,"e":"Signalling too early tells everyone you're leaving at the wrong exit, which can pull a driver out in front of you."},
{"c":"rules","q":"You want to turn right onto a dual carriageway with a narrow central reservation. What should you do?","o":["Wait until both carriageways are clear and cross in one movement","Cross to the reservation and wait there","Reverse onto the near carriageway","Turn left and make a U-turn"],"a":0,"e":"If the gap is too small for your vehicle, stopping in it leaves your back end sticking into fast-moving traffic."},
{"c":"rules","q":"When may you park on the pavement?","o":["Only where signs specifically allow it, and never in London","Anywhere the road is narrow","Whenever it's safe","Only at night"],"a":0,"e":"Pavement parking forces wheelchair users and pushchairs into the road, and is separately banned across Greater London."},
{"c":"rules","q":"You're approaching a level crossing and traffic is queuing on the far side. What should you do?","o":["Wait before the crossing until there's room beyond it","Cross and wait on the rails","Sound the horn and continue","Reverse away from the crossing"],"a":0,"e":"Never enter a crossing you can't clear. If you do end up stuck, get everyone out and use the railway telephone."},
{"c":"rules","q":"A tram has stopped in the road ahead and passengers are getting off. What should you do?","o":["Stop and wait until the passengers are clear","Pass slowly on the left","Sound your horn","Drive round the front of the tram"],"a":0,"e":"Where there's no separate platform, passengers step straight into the road. Trams can't swerve, and neither can you once they're out."},
{"c":"rules","q":"What's the rule about using a bus lane when you're cycling?","o":["Cycles are usually permitted, but check the sign","Cycles are never permitted","Cycles may use it only after 6pm","Cycles must dismount"],"a":0,"e":"Most bus lanes admit cycles and taxis. The plate under the sign lists exactly who may use it and when."},
{"c":"rules","q":"Two vehicles arrive at an unmarked crossroads at the same time. Who has priority?","o":["Nobody — proceed with great care","The vehicle on the right","The vehicle going straight ahead","The larger vehicle"],"a":0,"e":"This is where assumptions cause crashes. Slow right down, make eye contact, and be ready to give way."},
{"c":"rules","q":"You're turning right into a driveway and oncoming traffic is approaching. What should you do?","o":["Wait until there's a safe gap, without blocking the road unnecessarily","Turn quickly before they arrive","Signal and expect them to slow","Reverse in from the far side"],"a":0,"e":"Position correctly, signal early, and never assume an approaching driver has seen your indicator."},
{"c":"rules","q":"When must you use your seat belt?","o":["Whenever one is fitted, unless you hold a medical exemption certificate","Only on motorways","Only above 30mph","Only in the front seats"],"a":0,"e":"You may also be exempt while carrying out a manoeuvre that includes reversing."},
{"c":"rules","q":"Who is responsible for a passenger aged 14 or over wearing a seat belt?","o":["The passenger themselves","The driver","The vehicle owner","The insurer"],"a":0,"e":"The driver is responsible for anyone under 14. From 14 the passenger carries the responsibility and any fine."},
{"c":"rules","q":"When must a child use a child car seat?","o":["Until they're 12 years old or 135cm tall, whichever comes first","Until they're 10","Until they're 16","Only on long journeys"],"a":0,"e":"After that they must use an adult seat belt. The restraint must suit the child's height and weight."},
{"c":"rules","q":"What's the rule on making a U-turn?","o":["It's allowed unless signs prohibit it, but only when you can see it's safe","It's always illegal","It's allowed only in a one-way street","It's allowed only at night"],"a":0,"e":"Never U-turn on a motorway or dual carriageway, at the brow of a hill, or anywhere your view is limited."},
{"c":"rules","q":"You're driving in a one-way street and want to turn right. Where should you position yourself?","o":["In the right-hand lane","In the left-hand lane","In the centre of the road","Wherever there's space"],"a":0,"e":"In a one-way street you use the right-hand lane for a right turn, unlike an ordinary two-way road."},
{"c":"rules","q":"What does 'driving without due care and attention' cover?","o":["Driving below the standard of a careful and competent driver","Only speeding offences","Only crashes causing injury","Only drink driving"],"a":0,"e":"Eating, fiddling with a screen, or being distracted by passengers can all meet the test, even with no collision."},
{"c":"rules","q":"When may you enter a yellow box junction and wait?","o":["When turning right and held up only by oncoming traffic","Whenever the queue is short","When traffic lights are green","Never"],"a":0,"e":"Every other time, your exit road must be clear before you move into the box."},
{"c":"rules","q":"What should you do when you see a school crossing patrol ahead with children waiting?","o":["Slow down and be ready to stop","Continue if the patrol hasn't stepped out","Sound your horn","Drive past on the other side"],"a":0,"e":"Once they show the sign you must stop, and stay stopped until they're back on the pavement."},
{"c":"rules","q":"What's the rule about stopping on a clearway marked with a red route sign?","o":["You must not stop on the main carriageway at any time","You may stop for up to five minutes","You may stop to set down passengers","You may stop outside peak hours"],"a":0,"e":"Red routes are camera-enforced and the penalties are higher than for a yellow line."},
{"c":"rules","q":"You're waiting at a junction and a vehicle flashes its headlights at you. What should you do?","o":["Check for yourself that it's safe before moving","Pull out immediately","Assume they're warning you of danger","Sound your horn in reply"],"a":0,"e":"Officially a flash only means 'I am here'. Drivers have been hit pulling out on someone else's flash."},
{"c":"rules","q":"When can you overtake a vehicle that's slowing down for a pedestrian crossing?","o":["You must not overtake the leading vehicle on the approach","Once you've checked the crossing is clear","If you use the opposite lane","If the pedestrian hasn't stepped out"],"a":0,"e":"Overtaking there hides your vehicle from anyone stepping onto the crossing, and hides them from you."},

{"c":"rules","q":"You're parked on a hill facing downhill. What should you do?","o":["Turn the wheels towards the kerb and leave it in reverse","Turn the wheels away from the kerb","Leave it in neutral","Leave it in first gear"],"a":0,"e":"Wheels into the kerb means a rolling car stops against it. Facing uphill, turn them away from the kerb instead."},

{"c":"rules","q":"A cyclist is coming towards you on a narrow road with cars parked on their side. What should you do?","o":["Slow down and give way if necessary","Maintain speed — you have priority","Flash your headlights and continue","Move closer to the parked cars"],"a":0,"e":"The obstruction isn't on your side, but squeezing a cyclist into a line of parked cars puts them at real risk."},

{"c":"margins","q":"What's the overall stopping distance at 20mph in good conditions?","o":["12 metres (about 40 feet)","6 metres","23 metres","18 metres"],"a":0,"e":"6 metres thinking and 6 braking. It's still three car lengths, which surprises people in a 20mph zone."},

{"c":"margins","q":"What's the safest way to slow down on a bend?","o":["Do your braking before you start to turn in","Brake hard in the middle of the bend","Use the handbrake","Coast through in neutral"],"a":0,"e":"Braking while turning asks the tyres to do two jobs at once, which is exactly how grip runs out."},

const TOTAL = BANK.length;
const KEY = 'dante-theory-v1';
let S = {
  xp:0, seen:{}, wrongIds:[], streak:0, lastDay:null,
  mocks:[], badges:[], testDate:null, totalAnswered:0, totalRight:0
};
let memoryOnly = false;

const hasClaudeStore = typeof window.storage === 'object' && window.storage !== null
                    && typeof window.storage.get === 'function';
async function load(){
  try{
    let raw = null;
    if(hasClaudeStore){
      const r = await window.storage.get(KEY);
      raw = r && r.value;
    }else{
      raw = window.localStorage.getItem(KEY);
    }
    if(raw) S = Object.assign(S, JSON.parse(raw));
  }catch(e){ /* first run, or storage blocked */ }
  touchStreak();
}
async function save(){
  if(memoryOnly) return;
  try{
    const raw = JSON.stringify(S);
    if(hasClaudeStore) await window.storage.set(KEY, raw);
    else window.localStorage.setItem(KEY, raw);
  }catch(e){ memoryOnly = true; }
}
function today(){ return new Date().toISOString().slice(0,10); }
function touchStreak(){
  const t = today();
  if(S.lastDay === t) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  S.streak = (S.lastDay === y) ? S.streak+1 : 1;
  S.lastDay = t;
  save();
}

  let i=0; for(let k=0;k<RANKS.length;k++) if(S.xp>=RANKS[k].xp) i=k;
  const cur=RANKS[i], nxt=RANKS[i+1];
  const pct = nxt ? Math.round(((S.xp-cur.xp)/(nxt.xp-cur.xp))*100) : 100;
  return {name:cur.name, next:nxt?nxt.name:null, need:nxt?nxt.xp-S.xp:0, pct};
}
function masteredCount(){ return Object.values(S.seen).filter(v=>v.r>0).length; }
function readiness(){ return Math.round((masteredCount()/TOTAL)*100); }
function accuracy(){ return S.totalAnswered ? Math.round((S.totalRight/S.totalAnswered)*100) : 0; }
function catStats(c){
  const ids = BANK.map((q,i)=>[q,i]).filter(x=>x[0].c===c).map(x=>x[1]);
  const done = ids.filter(i=>S.seen[i] && S.seen[i].r>0).length;
  return {total:ids.length, done, pct: Math.round((done/ids.length)*100), ids};
}
function daysToTest(){
  if(!S.testDate) return null;
  const d = Math.ceil((new Date(S.testDate+'T12:00') - new Date())/86400000);
  return d;
}

function gauge(pct){
  const SEG = 34, lit = Math.round(SEG*pct/100);
  let segs = '';
  for(let i=0;i<SEG;i++){
    const a = (-90 + (i+.5)*(180/SEG))*Math.PI/180;
    const inr = 92, out = i%4===0 ? 116 : 110;
    const x1=150+Math.sin(a)*inr, y1=150-Math.cos(a)*inr;
    const x2=150+Math.sin(a)*out, y2=150-Math.cos(a)*out;
    const t = i/(SEG-1);
    const col = `rgb(${Math.round(63+(46-63)*t)},${Math.round(208+(230-208)*t)},${Math.round(255+(168-255)*t)})`;
    segs += `<line class="seg" data-c="${col}" data-on="${i<lit?1:0}"
      x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
      stroke="rgba(110,160,215,.20)" stroke-width="${i%4===0?5:3.4}" stroke-linecap="round"
      style="transition:stroke .3s ease ${i*16}ms, filter .3s ease ${i*16}ms"/>`;
  }
  return `<div class="gaugewrap">
    <svg class="gauge" viewBox="0 0 300 186" aria-label="Test readiness ${pct} per cent">
      <path d="M44 150 A106 106 0 0 1 256 150" fill="none" stroke="rgba(96,178,255,.10)" stroke-width="1.5"/>
      <path d="M62 150 A88 88 0 0 1 238 150" fill="none" stroke="rgba(96,178,255,.07)" stroke-width="1"/>
      ${segs}
      <g id="needle" transform="rotate(-90 150 150)" style="transition:transform 1.1s cubic-bezier(.2,.8,.2,1)">
        <path d="M150 74 L143 87 H157 Z" fill="#ffc447" style="filter:drop-shadow(0 0 6px rgba(255,196,71,.9))"/>
      </g>
    </svg>
    <div class="gaugeval"><div class="pct">${pct}<i>%</i></div></div>
  </div>`;
}
function sweepGauge(pct){
  const segs = document.querySelectorAll('.seg'), needle = document.getElementById('needle');
  requestAnimationFrame(()=>{
    segs.forEach(el=>{
      if(el.dataset.on==='1'){
        el.setAttribute('stroke', el.dataset.c);
        el.style.filter = 'drop-shadow(0 0 5px '+el.dataset.c+')';
      }
    });
    if(needle) needle.setAttribute('transform', `rotate(${-90+pct*1.8} 150 150)`);
  });
}

/* =======================================================================
   VOICEOVER
   The real theory test offers headphones and a voiceover: the question is
   read to you automatically and you can replay it as often as you like.
   This does the same using the browser's own speech engine — no internet
   connection needed once the page has loaded.
   ======================================================================= */
const TTS = typeof window.speechSynthesis !== 'undefined';
let ukVoice = null;

function pickVoice(){
  if(!TTS) return;
  try{
    const vs = window.speechSynthesis.getVoices();
    ukVoice = vs.find(v=>v.lang==='en-GB' && /female|Serena|Kate|Sonia|Libby/i.test(v.name))
           || vs.find(v=>v.lang==='en-GB')
           || vs.find(v=>v.lang && v.lang.startsWith('en'))
           || null;
  }catch(e){}
}
if(TTS){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

function voiceOn(){ return TTS && !!S.voice; }
function hush(){ if(TTS) try{ window.speechSynthesis.cancel(); }catch(e){} }

function speak(text, onEnd){
  if(!TTS || !text) return;
  hush();
  const u = new SpeechSynthesisUtterance(text);
  if(ukVoice) u.voice = ukVoice;
  u.lang = 'en-GB';
  u.rate = 0.95;
  u.pitch = 1;
  if(onEnd) u.onend = onEnd;
  try{ window.speechSynthesis.speak(u); }catch(e){}
}

function questionSpeech(q, ord){
  const letters = ['A','B','C','D'];
  let t = '';
  if(q.cs) t += CASES[q.cs].text + ' … ';
  t += q.q + ' … ';
  if(isMulti(q)) t += 'Mark ' + (q.m===2?'two':q.m) + ' answers. … ';
  if(q.s) t += 'A road sign is shown on screen. … ';
  if(q.oi){
    t += 'Four signs are shown on screen. Choose the correct one.';
  }else{
    t += ord.map((orig,k)=> letters[k] + '. ' + q.o[orig]).join(' … ');
  }
  return t;
}

function readQuestion(){
  if(!voiceOn() || !Q) return;
  speak(questionSpeech(BANK[Q.ids[Q.i]], Q.orders[Q.i]));
}

function toggleVoice(){
  if(!TTS){ toast('This browser can\'t read text aloud'); return; }
  S.voice = !S.voice;
  save();
  hush();
  toast(S.voice ? '🔊 Voiceover on' : 'Voiceover off');
  const b = document.getElementById('vbtn');
  if(b){ b.classList.toggle('on', !!S.voice); b.textContent = S.voice ? '🔊 On' : '🔇 Off'; }
  const r = document.getElementById('replayBtn');
  if(r) r.style.display = S.voice ? 'inline-flex' : 'none';
  if(S.voice && Q) readQuestion();
}

/* =======================================================================
   QUIZ ENGINE
   ======================================================================= */
let Q = null;  // {ids, i, mode, label, picks:[], answered:bool, endsAt, timer}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function allIds(){ return BANK.map((q,i)=>q.cs?-1:i).filter(i=>i>=0); }

function begin(ids, mode, label){
  if(!ids.length){ toast('Nothing to practise here yet'); return; }
  Q = {ids, i:0, mode, label, picks:new Array(ids.length).fill(null), answered:false, endsAt:null, timer:null,
       orders: ids.map(id => shuffle(BANK[id].o.map((_,k)=>k)))};
  if(mode==='mock'){
    Q.endsAt = Date.now() + 57*60*1000;
    Q.timer = setInterval(tick, 1000);
  }
  drawQ();
  show('s-quiz');
}
function startQuick(){ begin(shuffle(allIds()).slice(0,10), 'practice', 'Quick 10'); }
function startTopic(c){ begin(shuffle(catStats(c).ids), 'practice', CATS[c].name); }
function startSigns(){ begin(shuffle(BANK.map((q,i)=>(q.s||q.oi)?i:-1).filter(i=>i>=0)), 'practice', 'Sign lab'); }
function startWeak(){
  if(!S.wrongIds.length){ toast('No weak spots. Keep it that way.'); return; }
  begin(shuffle(S.wrongIds).slice(0,20), 'weak', 'Weak spots');
}
/* The real test doesn't sample topics evenly — signs, rules of the road, hazard
   awareness and safety margins carry the most questions, while documents and
   vehicle loading usually contribute one or two. This mirrors that spread. */
const MOCK_WEIGHTS = {signs:7, rules:6, hazard:5, margins:4, vulnerable:4, motorway:4,
                      vehicle:3, handling:3, alertness:3, attitude:2, others:2,
                      incidents:2, docs:1, loading:1};
function startMock(){
  let picked = [];
  for(const c in MOCK_WEIGHTS){
    const pool = BANK.map((q,i)=>(q.c===c && !q.cs) ? i : -1).filter(i=>i>=0);
    picked = picked.concat(shuffle(pool).slice(0, MOCK_WEIGHTS[c]));
  }
  picked = shuffle(picked);
  // the scenario questions come last, as the video-clip questions do in the real test
  const caseId = shuffle(Object.keys(CASES))[0];
  const caseQs = BANK.map((q,i)=>q.cs===caseId ? i : -1).filter(i=>i>=0);
  begin(picked.slice(0, 50-caseQs.length).concat(caseQs), 'mock', 'Mock test');
}

function tick(){
  const left = Q.endsAt - Date.now();
  const el = document.getElementById('clock');
  if(!el) return;
  if(left<=0){ clearInterval(Q.timer); finish(); return; }
  const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
  el.textContent = m+':'+String(s).padStart(2,'0');
  el.classList.toggle('warn', left < 5*60000);
}

function isMulti(q){ return Array.isArray(q.a); }
function sameSet(a,b){
  if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length) return false;
  const x=a.slice().sort(), y=b.slice().sort();
  return x.every((v,i)=>v===y[i]);
}
function wasRight(n){
  const q = BANK[Q.ids[n]], p = Q.picks[n];
  return isMulti(q) ? sameSet(p, q.a) : p===q.a;
}

function drawQ(){
  const id = Q.ids[Q.i], q = BANK[id], mock = Q.mode==='mock', multi = isMulti(q);
  const letters = ['A','B','C','D'], ord = Q.orders[Q.i];
  const opts = ord.map((orig,k)=> q.oi
    ? `<button class="opt pic" id="o${k}" onclick="pick(${k})">
         <span class="k">${letters[k]}</span>${signSVG(q.o[orig])}</button>`
    : `<button class="opt" id="o${k}" onclick="pick(${k})">
         <span class="k">${letters[k]}</span><span>${esc(q.o[orig])}</span></button>`).join('');
  const cse = q.cs ? CASES[q.cs] : null;
  document.getElementById('s-quiz').innerHTML = `
    <div class="qhead">
      <span class="meta">${esc(Q.label)} · ${Q.i+1} of ${Q.ids.length}${mock?` · ${Q.picks.filter(p=>p!==null).length} answered`:''}</span>
      <span style="display:flex;align-items:center;gap:10px">
        ${TTS?`<button class="vbtn${S.voice?' on':''}" id="vbtn" onclick="toggleVoice()">${S.voice?'🔊 On':'🔇 Off'}</button>`:''}
        ${mock ? `<button class="back" style="margin:0;padding:0" onclick="abandon()">Abandon</button>
                  <span class="clock" id="clock">57:00</span>`
               : `<button class="back" style="margin:0;padding:0" onclick="quit()">Quit</button>`}
      </span>
    </div>
    <div class="prog"><i style="width:${(Q.i/Q.ids.length*100)}%"></i></div>
    ${cse ? `<div class="scenario"><b>${esc(cse.title)}</b>${esc(cse.text)}</div>` : ''}
    ${q.s ? `<div class="signbox">${signSVG(q.s)}</div>` : ''}
    <p class="qtext">${esc(q.q)}</p>
    ${multi ? `<p class="pick">Mark ${q.m===2?'two':q.m} answers</p>` : ''}
    ${TTS ? `<button class="replay" id="replayBtn" onclick="readQuestion()"
              style="display:${S.voice?'inline-flex':'none'}">🔊 Read it again</button>` : ''}
    <div class="opts${q.oi?' pics':''}">${opts}</div>
    <div id="feedback"></div>
    ${mock ? `<div class="sticky"><div class="row">
        ${Q.i>0?'<button class="btn ghost" onclick="prev()">Previous</button>':''}
        <button class="btn${Q.i===Q.ids.length-1?' go':' ghost'}" onclick="skip()">${Q.i===Q.ids.length-1?'Finish test':'Next question'}</button>
      </div></div>` : ''}`;
  Q.answered = false;
  if(mock && Q.picks[Q.i]!==null){
    const chosen = multi ? Q.picks[Q.i] : [Q.picks[Q.i]];
    chosen.forEach(orig=>{
      const d = ord.indexOf(orig);
      if(d>-1) document.getElementById('o'+d).classList.add('sel');
    });
  }
  if(mock) tick();
  if(voiceOn()) readQuestion();
}

function pick(k){
  const id = Q.ids[Q.i], q = BANK[id], ord = Q.orders[Q.i], chosen = ord[k];
  const mock = Q.mode==='mock', multi = isMulti(q);

  if(multi){
    if(Q.answered) return;
    let cur = Array.isArray(Q.picks[Q.i]) ? Q.picks[Q.i].slice() : [];
    const at = cur.indexOf(chosen);
    if(at>-1) cur.splice(at,1); else cur.push(chosen);
    while(cur.length > q.m) cur.shift();
    Q.picks[Q.i] = cur.length ? cur : null;
    ord.forEach((orig,j)=>document.getElementById('o'+j).classList.toggle('sel', cur.includes(orig)));
    if(!mock && cur.length===q.m) reveal(q, ord, cur);
    return;
  }

  if(mock){
    Q.picks[Q.i]=chosen;
    for(let j=0;j<ord.length;j++) document.getElementById('o'+j).classList.toggle('sel', j===k);
    return;
  }
  if(Q.answered) return;
  Q.picks[Q.i]=chosen;
  reveal(q, ord, chosen);
}

function reveal(q, ord, picked){
  Q.answered = true;
  const multi = isMulti(q);
  const correct = multi ? q.a : [q.a];
  const chosen = multi ? picked : [picked];
  const right = multi ? sameSet(picked, q.a) : picked===q.a;
  ord.forEach((orig,j)=>{
    const el = document.getElementById('o'+j);
    el.disabled = true; el.classList.remove('sel');
    if(correct.includes(orig)) el.classList.add('right');
    else if(chosen.includes(orig)) el.classList.add('wrong');
  });
  record(Q.ids[Q.i], right);
  const label = right ? 'Correct'
    : multi ? 'Not quite — the correct answers are shown in green'
            : 'Not quite — the answer is ' + ['A','B','C','D'][ord.indexOf(q.a)];
  document.getElementById('feedback').innerHTML = `
    <div class="why ${right?'ok':'no'}"><b>${label}</b>${esc(q.e)}</div>
    <button class="btn ${right?'go':''}" onclick="next()">${Q.i===Q.ids.length-1?'See results':'Next question'}</button>`;
  const fb = document.getElementById('feedback');
  if(fb.scrollIntoView) fb.scrollIntoView({behavior:'smooth', block:'nearest'});
  if(voiceOn()) speak(label + '. ' + q.e);
}

function record(id, right){
  S.seen[id] = S.seen[id] || {r:0,w:0};
  S.totalAnswered++;
  if(right){
    const first = S.seen[id].r===0;
    S.seen[id].r++; S.totalRight++;
    S.xp += first ? 10 : 4;
    const at = S.wrongIds.indexOf(id);
    if(at>-1){
      S.wrongIds.splice(at,1);
      S.fixed = (S.fixed||0)+1;
      if(S.fixed>=10) award('redeemed');
    }
  }else{
    S.seen[id].w++;
    if(!S.wrongIds.includes(id)) S.wrongIds.push(id);
  }
  if(S.totalAnswered>=10) award('ignition');
  if(S.totalAnswered>=100) award('century');
  if(S.totalAnswered>=300) award('grinder');
  if(S.streak>=3) award('streak3');
  if(S.streak>=7) award('streak7');
  save();
}

function next(){ hush(); if(Q.i<Q.ids.length-1){ Q.i++; drawQ(); } else finish(); }
function skip(){ hush(); if(Q.i<Q.ids.length-1){ Q.i++; drawQ(); } else finish(); }
function prev(){ hush(); if(Q.i>0){ Q.i--; drawQ(); } }
function quit(){ hush(); if(Q&&Q.timer) clearInterval(Q.timer); Q=null; renderHome(); }
function abandon(){
  const done = Q.picks.filter(p=>p!==null).length;
  if(confirm('Abandon the mock? '+done+' of '+Q.ids.length+' answered. Nothing will be scored.')) quit();
}

/* =======================================================================
   RESULTS
   ======================================================================= */
function finish(){
  hush();
  if(Q.timer) clearInterval(Q.timer);
  const mock = Q.mode==='mock';
  let score = 0;
  const byCat = {};
  Q.ids.forEach((id,n)=>{
    const q = BANK[id], right = wasRight(n);
    if(mock) record(id, right);
    if(right) score++;
    byCat[q.c] = byCat[q.c] || {r:0,t:0};
    byCat[q.c].t++; if(right) byCat[q.c].r++;
  });
  const total = Q.ids.length;
  const pass = mock ? score>=43 : score/total>=0.86;

  if(mock){
    S.mocks.push(score);
    if(score>=43){ S.xp += 100; award('boss'); }
    if(score>=48) award('ace');
  }else if(score===total && total>=8){
    award(Q.label==='Sign lab' ? 'signs' : 'flawless');
  }
  save();

  const missed = Q.ids.map((id,n)=>({id,n})).filter(x=>!wasRight(x.n));
  const review = missed.map(x=>{
    const q = BANK[x.id];
    return `<div style="border-bottom:1px solid rgba(96,178,255,.14);padding:12px 0">
      ${q.s?`<div style="width:60px;margin-bottom:6px">${signSVG(q.s)}</div>`:''}
      <div style="font-weight:600">${esc(q.q)}</div>
      ${q.oi
        ? `<div style="width:64px;margin-top:6px">${signSVG(q.o[q.a])}</div>`
        : `<div class="small" style="color:var(--go);margin-top:4px">Answer: ${esc(isMulti(q)? q.a.map(i=>q.o[i]).join(' + ') : q.o[q.a])}</div>`}
      <div class="small mute" style="margin-top:2px">${esc(q.e)}</div></div>`;
  }).join('');

  const rows = Object.keys(byCat).map(c=>{
    const b = byCat[c], p = Math.round(b.r/b.t*100);
    return `<div class="brow"><span style="width:26px">${CATS[c].emoji}</span>
      <span class="nm">${CATS[c].name}</span>
      <span class="bar"><i style="width:${p}%;background:${p>=80?'var(--go)':p>=50?'var(--amber)':'var(--stop)'};box-shadow:0 0 8px currentColor"></i></span>
      <span class="n">${b.r}/${b.t}</span></div>`;
  }).join('');

  let verdictWord, note;
  if(mock){
    verdictWord = pass ? 'PASS' : 'NOT YET';
    note = pass
      ? (score>=48 ? 'That would have been a comfortable pass. Do another one in a couple of days to prove it wasn\'t luck.'
                   : 'Over the line. Keep mocking until you\'re clearing 46+ every time.')
      : 'You needed 43. Everything you missed is now sitting in your weak spots — go clear it, then run this again.';
  }else{
    verdictWord = score===total ? 'CLEAN SWEEP' : score/total>=0.86 ? 'SOLID' : 'NEEDS WORK';
    note = score===total ? 'Nothing missed. Pick a harder topic.'
         : 'Anything you got wrong is in your weak spots now.';
  }

  document.getElementById('s-result').innerHTML = `
    <div class="verdict">
      <div class="big ${mock?(pass?'pass':'fail'):''}">${score}<span>/${total}</span></div>
      <div class="word ${mock?(pass?'pass':'fail'):''}">${verdictWord}</div>
      ${mock?`<p class="mute small">Pass mark is 43 out of 50 · ${Math.round(score/total*100)}%</p>`:''}
    </div>
    <p>${note}</p>
    <div class="breakdown"><h3 style="margin-bottom:6px">How it broke down</h3>${rows}</div>
    ${missed.length?`<h3 style="margin-top:24px">What you missed (${missed.length})</h3>${review}`:''}
    <div class="row" style="margin-top:20px">
      <button class="btn ghost" onclick="renderHome()">Home</button>
      <button class="btn" onclick="${mock?'startMock()':'startWeak()'}">${mock?'Another mock':'Fix weak spots'}</button>
    </div>`;
  Q = null;
  show('s-result');
}


/* =======================================================================
   HAZARD PERCEPTION
   The real test uses filmed clips. This renders a simplified driving scene
   instead, but the scoring works exactly as DVSA's does: each developing
   hazard has a five-band window, and the earlier you spot it the more you
   score. Clicking constantly scores zero for that clip, as it does in the
   real test.
   ======================================================================= */

const HZ = {
  run:null, clip:null, raf:null, canvas:null, ctx:null,
  t:0, last:0, clicks:[], scored:[], flagged:false
};

/* ---------- scene building blocks ---------- */
function hzCar(x, z, colour, opts){
  return Object.assign({kind:'car', x, z, w:1.8, h:1.45, colour:colour||'#2d4f86', speed:0}, opts||{});
}
function hzObj(kind, x, z, opts){
  const base = {
    parked:   {w:1.8, h:1.4,  colour:'#39506f'},
    oncoming: {w:1.8, h:1.45, colour:'#5a3a5f'},
    bus:      {w:2.5, h:3.2,  colour:'#8a3b2e'},
    lorry:    {w:2.5, h:3.6,  colour:'#4a4a52'},
    ped:      {w:0.8, h:1.8,  colour:'#ffd9a0'},
    cyclist:  {w:0.8, h:1.75, colour:'#e8f0fb'},
    ball:     {w:0.5, h:0.5,  colour:'#ff8a3d'}
  }[kind];
  return Object.assign({kind, x, z, speed:0}, base, opts||{});
}

/* ---------- the clips ----------
   Each returns: speed (m/s), duration (s), scene name, what the hazard is,
   the objects, a per-frame update, and the hazard windows.            */
const CLIPS = [
  function pedestrianSteps(side){
    const s = side||1, o = [];
    for(let z=60; z<130; z+=9) o.push(hzObj('parked', -3.3*s, z));
    const p = hzObj('ped', -5.6*s, 88);
    o.push(p);
    return {name:'Residential street', hazard:'A pedestrian stepping out between parked cars',
      speed:11, duration:12, objects:o, hazards:[{start:5.4, band:0.8}],
      update(t,dt){ if(t>5.4) p.x += (2.6*s)*dt; }};
  },
  function carPullsOut(side){
    const s = side||-1, o = [];
    for(let z=50; z<90; z+=11) o.push(hzObj('parked', 3.3*s*-1, z));
    const c = hzCar(7.5*s, 96, '#7a2f3a');
    o.push(c);
    return {name:'Side road on the left', hazard:'A car emerging from the side road',
      speed:12, duration:12, objects:o, hazards:[{start:5.0, band:0.8}],
      update(t,dt){ if(t>5.0){ c.x += (-5.6*s)*dt; c.z -= 3.4*dt; } }};
  },
  function cyclistMovesOut(){
    const o = [], c = hzObj('cyclist', -3.1, 74, {speed:5});
    o.push(hzObj('parked', -3.3, 95), hzObj('parked', -3.3, 103), c);
    return {name:'Town road with parked cars', hazard:'A cyclist pulling out around a parked car',
      speed:11, duration:12, objects:o, hazards:[{start:5.6, band:0.8}],
      update(t,dt){ c.z += 5*dt; if(t>5.6) c.x += 1.5*dt; }};
  },
  function doorOpens(){
    const o = [], d = hzObj('parked', -3.3, 84, {door:0});
    for(let z=58; z<120; z+=10) if(z!==92) o.push(hzObj('parked', -3.3, z));
    o.push(d);
    return {name:'Narrow high street', hazard:'A car door opening into your path',
      speed:10, duration:11, objects:o, hazards:[{start:5.2, band:0.8}],
      update(t,dt){ if(t>5.2) d.door = Math.min(1.5, d.door + 1.4*dt); }};
  },
  function ballThenChild(){
    const o = [], b = hzObj('ball', -6.5, 80), k = hzObj('ped', -7.2, 82, {h:1.25, colour:'#ffd9a0'});
    for(let z=55; z<120; z+=12) o.push(hzObj('parked', 3.3, z));
    o.push(b, k);
    return {name:'Quiet estate road', hazard:'A ball, then a child running after it',
      speed:10, duration:12, objects:o, hazards:[{start:4.6, band:0.8}],
      update(t,dt){ if(t>4.6) b.x += 5.5*dt; if(t>5.6) k.x += 4.2*dt; }};
  },
  function busPullsOut(){
    const o = [], b = hzObj('bus', -3.6, 90);
    o.push(b, hzObj('parked', 3.3, 70));
    return {name:'Bus stop ahead', hazard:'A bus signalling and moving off',
      speed:12, duration:12, objects:o, hazards:[{start:5.0, band:0.8}],
      update(t,dt){ if(t>5.0){ b.x += 1.9*dt; b.z += 4*dt; } b.indicating = t>4.4; }};
  },
  function oncomingOvertakes(){
    const o = [], c = hzObj('oncoming', 3.4, 150, {speed:-14});
    o.push(c, hzObj('parked', 3.3, 120));
    return {name:'Rural single carriageway', hazard:'An oncoming car pulling onto your side',
      speed:13, duration:11, objects:o, hazards:[{start:4.4, band:0.8}],
      update(t,dt){ c.z -= 16*dt; if(t>4.4) c.x -= 3.2*dt; }};
  },
  function lorryReverses(){
    const o = [], l = hzObj('lorry', 9, 92);
    o.push(l);
    return {name:'Industrial estate', hazard:'A lorry reversing across the road',
      speed:11, duration:12, objects:o, hazards:[{start:5.2, band:0.8}],
      update(t,dt){ if(t>5.2) l.x -= 2.4*dt; }};
  },
  function carBrakesHard(){
    const o = [], c = hzCar(-1.6, 40, '#2f6b52', {speed:11});
    o.push(c, hzObj('parked', 3.3, 90));
    return {name:'Queue building ahead', hazard:'The car in front braking sharply',
      speed:12, duration:11, objects:o, hazards:[{start:4.8, band:0.8}],
      update(t,dt){ c.z += (t>4.8?2:11)*dt; c.braking = t>4.8; }};
  },
  function pedOnZebra(){
    const o = [], p = hzObj('ped', -6.2, 84);
    o.push(p, hzObj('parked', 3.3, 60), hzObj('parked', 3.3, 72));
    return {name:'Approaching a zebra crossing', hazard:'A pedestrian about to step onto the crossing',
      speed:11, duration:11, objects:o, zebra:84, hazards:[{start:4.8, band:0.8}],
      update(t,dt){ if(t>4.8) p.x += 2.2*dt; }};
  },
  function twoHazards(){
    const o = [], p = hzObj('ped', -6.0, 72), c = hzCar(8, 128, '#7a2f3a');
    for(let z=50; z<75; z+=11) o.push(hzObj('parked', -3.3, z));
    o.push(p, c);
    return {name:'Busy town centre', hazard:'Two developing hazards in one clip',
      speed:11, duration:16, objects:o, hazards:[{start:3.6, band:0.8},{start:9.2, band:0.8}],
      update(t,dt){ if(t>3.6) p.x += 2.4*dt; if(t>9.2){ c.x -= 6*dt; c.z -= 3*dt; } }};
  }
];

/* ---------- drawing ---------- */
const HZCFG = {focal:540, camH:1.35, roadHalf:4.2};

function hzProject(x, relz, w, h){
  const sc = HZCFG.focal / Math.max(relz, 0.8);
  return {sc, sx: w/2 + x*sc, sy: h*0.44 + HZCFG.camH*sc};
}

function hzDraw(){
  const c = HZ.ctx, W = HZ.canvas.width, H = HZ.canvas.height, clip = HZ.clip, t = HZ.t;
  const camZ = clip.speed * t, hz = H*0.44;

  // sky and ground
  const sky = c.createLinearGradient(0,0,0,hz);
  sky.addColorStop(0,'#0d2748'); sky.addColorStop(1,'#2b5c86');
  c.fillStyle = sky; c.fillRect(0,0,W,hz);
  c.fillStyle = '#16301f'; c.fillRect(0,hz,W,H-hz);

  // road surface
  const near = hzProject(0, 2, W, H), far = hzProject(0, 140, W, H);
  const nl = hzProject(-HZCFG.roadHalf, 2, W, H), nr = hzProject(HZCFG.roadHalf, 2, W, H);
  const fl = hzProject(-HZCFG.roadHalf, 140, W, H), fr = hzProject(HZCFG.roadHalf, 140, W, H);
  c.fillStyle = '#31343b';
  c.beginPath(); c.moveTo(nl.sx, nl.sy); c.lineTo(nr.sx, nr.sy); c.lineTo(fr.sx, fr.sy); c.lineTo(fl.sx, fl.sy); c.closePath(); c.fill();

  // pavements
  c.fillStyle = '#4a4e57';
  [[-1],[1]].forEach(([s])=>{
    const a = hzProject(s*HZCFG.roadHalf, 2, W, H), b = hzProject(s*(HZCFG.roadHalf+2.4), 2, W, H);
    const d = hzProject(s*HZCFG.roadHalf, 140, W, H), e = hzProject(s*(HZCFG.roadHalf+2.4), 140, W, H);
    c.beginPath(); c.moveTo(a.sx,a.sy); c.lineTo(b.sx,b.sy); c.lineTo(e.sx,e.sy); c.lineTo(d.sx,d.sy); c.closePath(); c.fill();
  });

  // centre line dashes
  c.fillStyle = '#d9dde4';
  for(let z = 8 - (camZ % 8); z < 130; z += 8){
    const a = hzProject(-0.12, z, W, H), b = hzProject(0.12, z, W, H), d = hzProject(0.12, z+3.2, W, H), e = hzProject(-0.12, z+3.2, W, H);
    c.beginPath(); c.moveTo(a.sx,a.sy); c.lineTo(b.sx,b.sy); c.lineTo(d.sx,d.sy); c.lineTo(e.sx,e.sy); c.closePath(); c.fill();
  }

  // zebra stripes if this clip has one
  if(clip.zebra){
    const rz = clip.zebra - camZ;
    if(rz > 2 && rz < 120){
      c.fillStyle = '#e8ecf2';
      for(let i=-4;i<=4;i++){
        const a = hzProject(i*1.0, rz, W, H), b = hzProject(i*1.0+0.55, rz, W, H),
              d = hzProject(i*1.0+0.55, rz+4, W, H), e = hzProject(i*1.0, rz+4, W, H);
        c.beginPath(); c.moveTo(a.sx,a.sy); c.lineTo(b.sx,b.sy); c.lineTo(d.sx,d.sy); c.lineTo(e.sx,e.sy); c.closePath(); c.fill();
      }
    }
  }

  // roadside blocks, for a sense of speed
  c.fillStyle = '#122b1c';
  for(let z = 12 - (camZ % 12); z < 130; z += 12){
    [-1,1].forEach(s=>{
      const p = hzProject(s*9.5, z, W, H), hgt = 4*p.sc;
      c.fillRect(p.sx - 1.6*p.sc, p.sy - hgt, 3.2*p.sc, hgt);
    });
  }

  // objects, furthest first
  clip.objects.slice().sort((a,b)=>(b.z-camZ)-(a.z-camZ)).forEach(o=>{
    const rz = o.z - camZ;
    if(rz < 1.2 || rz > 145) return;
    const p = hzProject(o.x, rz, W, H);
    const w = o.w * p.sc, h = o.h * p.sc, x = p.sx - w/2, y = p.sy - h;

    if(o.kind==='ped' || o.kind==='cyclist'){
      c.fillStyle = o.colour;
      c.fillRect(x, y + h*0.22, w, h*0.78);
      c.beginPath(); c.arc(p.sx, y + h*0.14, w*0.52, 0, 7); c.fill();
      if(o.kind==='cyclist'){
        c.strokeStyle = '#8fa4bd'; c.lineWidth = Math.max(1, p.sc*0.05);
        c.beginPath(); c.arc(p.sx, p.sy - h*0.12, h*0.16, 0, 7); c.stroke();
      }
    } else if(o.kind==='ball'){
      c.fillStyle = o.colour;
      c.beginPath(); c.arc(p.sx, p.sy - h/2, w/2, 0, 7); c.fill();
    } else {
      // body
      c.fillStyle = o.colour;
      c.fillRect(x, y, w, h);
      // glass
      c.fillStyle = 'rgba(12,24,44,.55)';
      c.fillRect(x + w*0.12, y + h*0.12, w*0.76, h*0.34);
      // open door
      if(o.door > 0){
        c.fillStyle = o.colour;
        c.fillRect(x + w, y + h*0.25, o.door*0.9*p.sc, h*0.55);
      }
      if(o.kind==='oncoming'){
        c.fillStyle = '#fff3c4';
        c.fillRect(x + w*0.08, y + h*0.62, w*0.2, h*0.16);
        c.fillRect(x + w*0.72, y + h*0.62, w*0.2, h*0.16);
      } else {
        c.fillStyle = o.braking ? '#ff3b30' : '#8f2b24';
        c.fillRect(x + w*0.06, y + h*0.55, w*0.18, h*0.14);
        c.fillRect(x + w*0.76, y + h*0.55, w*0.18, h*0.14);
      }
      if(o.indicating && Math.floor(HZ.t*2)%2===0){
        c.fillStyle = '#ffb81c';
        c.fillRect(x + w*0.76, y + h*0.72, w*0.18, h*0.12);
      }
    }
  });

  // your own bonnet, to anchor the view
  c.fillStyle = '#0a1422';
  c.beginPath();
  c.moveTo(0, H); c.lineTo(0, H*0.93); c.quadraticCurveTo(W/2, H*0.83, W, H*0.93); c.lineTo(W, H); c.closePath(); c.fill();

  // click flags
  HZ.clicks.forEach((cl,i)=>{
    c.fillStyle = cl.scored ? '#2ee6a8' : '#ff4d63';
    c.fillRect(10 + i*13, H - 22, 9, 12);
  });

  // clip counter
  c.fillStyle = 'rgba(230,242,255,.85)';
  c.font = '600 13px Overpass, sans-serif';
  c.fillText('Clip ' + (HZ.run.i+1) + ' of ' + HZ.run.clips.length, 10, 20);
}

/* ---------- the loop ---------- */
function hzFrame(ts){
  if(!HZ.clip) return;
  if(!HZ.last) HZ.last = ts;
  const dt = Math.min(0.05, (ts - HZ.last)/1000);
  HZ.last = ts;
  HZ.t += dt;
  HZ.clip.update(HZ.t, dt);
  hzDraw();
  if(HZ.t >= HZ.clip.duration){ hzEndClip(); return; }
  HZ.raf = requestAnimationFrame(hzFrame);
}

/* ---------- clicking ---------- */
function hzClick(){
  if(!HZ.clip) return;
  const t = HZ.t;
  HZ.clicks.push({t, scored:false});

  // the real test voids a clip if you click continuously or in a pattern
  const recent = HZ.clicks.filter(c=>t - c.t < 3).length;
  if(!HZ.flagged && (HZ.clicks.length > 14 || recent > 6)){
    HZ.flagged = true;
    HZ.scored = HZ.clip.hazards.map(()=>0);
  }
  if(HZ.flagged) return;

  HZ.clip.hazards.forEach((hzd,i)=>{
    if(HZ.scored[i] > 0) return;
    const into = t - hzd.start;
    if(into >= 0 && into < hzd.band*5){
      HZ.scored[i] = 5 - Math.floor(into / hzd.band);
      HZ.clicks[HZ.clicks.length-1].scored = true;
    }
  });
}

/* ---------- run management ---------- */
function hzStartRun(n){
  // exactly one clip in a full run carries two hazards, as in the real test
  const withTwo = CLIPS.length - 1;
  const picks = shuffle(CLIPS.map((f,i)=>i).filter(i=>i!==withTwo));
  const list = [];
  for(let i=0;i<n;i++){
    const idx = (n >= 14 && i === n-1) ? withTwo : picks[i % picks.length];
    list.push({make:CLIPS[idx], side: i%2 ? 1 : -1});
  }
  HZ.run = {clips:list, i:0, scores:[], full:n>=14};
  hzPlay();
}

function hzPlay(){
  const spec = HZ.run.clips[HZ.run.i];
  HZ.clip = spec.make(spec.side);
  HZ.t = 0; HZ.last = 0; HZ.clicks = []; HZ.flagged = false;
  HZ.scored = HZ.clip.hazards.map(()=>0);

  document.getElementById('s-hazard').innerHTML = `
    <div class="qhead">
      <span class="meta">Hazard perception · clip ${HZ.run.i+1} of ${HZ.run.clips.length}</span>
      <button class="back" style="margin:0;padding:0" onclick="hzQuit()">Quit</button>
    </div>
    <canvas id="hzCanvas" class="hzcanvas"></canvas>
    <p class="mute small" style="margin-top:10px">Tap the picture the moment you see a hazard developing.</p>`;
  show('s-hazard');

  const cv = document.getElementById('hzCanvas');
  const wid = Math.min(cv.parentElement.clientWidth || 380, 600);
  cv.width = Math.round(wid * (window.devicePixelRatio > 1 ? 2 : 1));
  cv.height = Math.round(cv.width * 0.66);
  cv.style.width = wid + 'px';
  cv.style.height = Math.round(wid * 0.66) + 'px';
  HZ.canvas = cv; HZ.ctx = cv.getContext('2d');
  cv.addEventListener('pointerdown', e=>{ e.preventDefault(); hzClick(); });

  HZ.raf = requestAnimationFrame(hzFrame);
}

function hzEndClip(){
  cancelAnimationFrame(HZ.raf);
  const got = HZ.scored.reduce((a,b)=>a+b,0);
  const max = HZ.clip.hazards.length * 5;
  HZ.run.scores.push(got);
  const clip = HZ.clip;
  const flagged = HZ.flagged;
  HZ.clip = null;

  const verdict = flagged ? 'Clip voided'
    : got === 0 ? 'Missed it'
    : got >= 4 ? 'Spotted it early' : got >= 2 ? 'A bit late' : 'Very late';

  document.getElementById('s-hazard').innerHTML = `
    <div class="verdict" style="padding-top:30px">
      <div class="big ${got>=3?'pass':got===0?'fail':''}">${got}<span>/${max}</span></div>
      <div class="word ${got>=3?'pass':got===0?'fail':''}">${verdict}</div>
    </div>
    <div class="why ${got>=3?'ok':'no'}" style="margin-top:18px">
      <b>${esc(clip.name)}</b>${flagged
        ? 'You clicked too often. In the real test, clicking continuously or in a regular pattern scores zero for that clip.'
        : 'The hazard was: ' + esc(clip.hazard) + (got===0
            ? '. You either missed it or clicked before it began developing — clicks before the window opens score nothing.'
            : '. Each second you delay costs you a point, so click as soon as something starts to change.')}</div>
    <button class="btn go" onclick="hzNext()">${HZ.run.i === HZ.run.clips.length-1 ? 'See your score' : 'Next clip'}</button>
    <button class="btn ghost" onclick="hzQuit()">Stop here</button>`;
  show('s-hazard');
}

function hzNext(){
  if(HZ.run.i < HZ.run.clips.length-1){ HZ.run.i++; hzPlay(); }
  else hzFinish();
}

function hzFinish(){
  const total = HZ.run.scores.reduce((a,b)=>a+b,0);
  const max = HZ.run.clips.length === 14 ? 75 : HZ.run.clips.length*5;
  const pass = HZ.run.clips.length === 14 ? total >= 44 : total >= Math.round(max*0.586);
  if(HZ.run.full){
    S.hzBest = Math.max(S.hzBest||0, total);
    if(total >= 44) award('eyes');
    save();
  }
  const rows = HZ.run.scores.map((sc,i)=>`
    <div class="brow"><span class="nm">Clip ${i+1}</span>
      <span class="bar"><i style="width:${(sc/5)*100}%;background:${sc>=3?'var(--go)':sc>0?'var(--amber)':'var(--stop)'}"></i></span>
      <span class="n">${sc}/5</span></div>`).join('');
  document.getElementById('s-hazard').innerHTML = `
    <div class="verdict">
      <div class="big ${pass?'pass':'fail'}">${total}<span>/${max}</span></div>
      <div class="word ${pass?'pass':'fail'}">${pass?'PASS':'NOT YET'}</div>
      ${HZ.run.clips.length===14?'<p class="mute small">The real pass mark is 44 out of 75</p>':''}
    </div>
    <p>${pass ? 'Good spotting. Keep clicking as soon as something starts to change, not once it becomes obvious.'
              : 'Most lost marks come from clicking too late. The window opens at the first clue — a head turning, an indicator, a shadow moving.'}</p>
    <div class="breakdown"><h3 style="margin-bottom:6px">Clip by clip</h3>${rows}</div>
    <div class="row" style="margin-top:20px">
      <button class="btn ghost" onclick="hzQuit()">Home</button>
      <button class="btn" onclick="hzIntro()">Go again</button>
    </div>`;
  show('s-hazard');
}

function hzQuit(){
  cancelAnimationFrame(HZ.raf);
  HZ.clip = null; HZ.run = null;
  renderHome();
}

function hzIntro(){
  document.getElementById('s-hazard').innerHTML = `
    <button class="back" onclick="renderHome()">‹ Back</button>
    <h2>Hazard perception</h2>
    <p class="mute small">A developing hazard is something that makes you change speed or direction.
    Tap the moment you see one starting — the earlier you are, the more you score, from 5 down to 0.</p>
    <div class="why" style="margin-top:14px">
      <b>How the real test works</b>14 clips, 15 scoreable hazards, 75 marks available and 44 to pass.
      You can't go back and clips play once. Clicking constantly to game it scores zero for that clip.</div>
    <div class="why no" style="margin-top:10px">
      <b>Be aware</b>These are drawn animations, not the filmed clips DVSA uses. They're here to train your
      timing and your clicking, not to look like the real footage. Practise on real video too.</div>
    ${S.hzBest?`<p class="small mute" style="margin-top:14px">Your best full run: ${S.hzBest}/75</p>`:''}
    <button class="btn go" onclick="hzStartRun(5)">Practice — 5 clips</button>
    <button class="btn ghost" onclick="hzStartRun(14)">Full test — 14 clips</button>`;
  show('s-hazard');
}

(async function(){
  await load();
  renderHome();
  fillSplash();
})();
</script>
