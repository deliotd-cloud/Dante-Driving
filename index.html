<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dante's Theory Test Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Overpass:ital,wght@0,300;0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#040a14;
    --deep:#07121f;
    --skin:linear-gradient(165deg, rgba(34,72,118,.55), rgba(10,26,48,.82));
    --hair:rgba(96,178,255,.22);
    --ice:#e6f2ff;
    --dim:#7f9dc6;
    --azure:#3fd0ff;
    --violet:#9b8cff;
    --go:#2ee6a8;
    --stop:#ff4d63;
    --amber:#ffc447;
    --cham:polygon(0 0, calc(100% - 13px) 0, 100% 13px, 100% 100%, 13px 100%, 0 calc(100% - 13px));
    --chamS:polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{background:var(--void)}
  body{
    background:transparent;
    padding-top:76px;
    color:var(--ice);
    font-family:Overpass,'Segoe UI',system-ui,sans-serif;
    font-size:17px;line-height:1.45;
    padding:0 16px 120px;max-width:620px;margin:0 auto;
    font-variant-numeric:tabular-nums;
    position:relative;
  }
  body:before{
    content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:
      radial-gradient(95% 55% at 50% -8%, rgba(63,208,255,.20), transparent 62%),
      radial-gradient(80% 50% at 105% 102%, rgba(155,140,255,.16), transparent 60%),
      linear-gradient(180deg,#061020 0%, var(--void) 70%);
  }
  body:after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;
    background-image:
      linear-gradient(rgba(96,178,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(96,178,255,.07) 1px, transparent 1px);
    background-size:34px 34px;
    -webkit-mask-image:radial-gradient(120% 70% at 50% 0%, #000 0%, transparent 72%);
    mask-image:radial-gradient(120% 70% at 50% 0%, #000 0%, transparent 72%);
  }

  h1,h2,h3{font-family:'Chakra Petch',Overpass,sans-serif;font-weight:700;line-height:1.1;letter-spacing:.005em;margin:0}
  h1{font-size:30px}
  h2{font-size:23px}
  h3{font-size:18px;font-weight:600}
  p{margin:.5em 0}
  button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .screen{display:none;padding-top:6px}
  .screen.on{display:block}
  .mute{color:var(--dim)}
  .small{font-size:14px}
  .num{font-family:'Chakra Petch',monospace;font-weight:700;font-variant-numeric:tabular-nums}

  /* ---------- Dante's car ---------- */
  .corner-car{
    position:fixed;top:8px;right:max(12px, calc(50% - 300px));width:92px;height:auto;
    z-index:40;pointer-events:none;
    filter:drop-shadow(0 7px 14px rgba(0,0,0,.6)) drop-shadow(0 0 16px rgba(63,208,255,.25));
  }
  .carwrap{position:relative;display:grid;place-items:center;width:100%}
  .carglow{
    position:absolute;width:104%;height:62%;pointer-events:none;
    background:radial-gradient(ellipse at 50% 55%, rgba(63,208,255,.32), rgba(155,140,255,.16) 45%, transparent 70%);
    animation:pulse 3.6s ease-in-out infinite;
  }
  .car{
    position:relative;width:min(88vw,430px);height:auto;display:block;
    filter:drop-shadow(0 24px 28px rgba(0,0,0,.65));
    animation:carIn .85s cubic-bezier(.2,.9,.3,1.04) both;
  }
  @keyframes carIn{from{transform:translateX(-52px) scale(.95);opacity:0}to{transform:none;opacity:1}}

  .hzcanvas{
    display:block;width:100%;max-width:600px;margin:0 auto;
    clip-path:var(--chamS);background:#0a1422;touch-action:manipulation;cursor:pointer;
    box-shadow:inset 0 0 0 1px var(--hair);
  }
  .quizcar{display:none;position:relative;margin:30px auto 4px;max-width:440px}
  .quizcar.on{display:block}
  .quizcar img{
    position:relative;width:100%;height:auto;display:block;opacity:.94;
    filter:drop-shadow(0 20px 26px rgba(0,0,0,.7));
  }
  .quizcar:before{
    content:"";position:absolute;left:-2%;right:-2%;top:22%;bottom:6%;
    background:radial-gradient(ellipse at 50% 60%, rgba(63,208,255,.20), transparent 68%);
  }
  .quizcar:after{
    content:"";position:absolute;left:6%;right:6%;bottom:2%;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,rgba(63,208,255,.55),transparent);
  }

  /* ---------- splash ---------- */
  #splash{
    position:fixed;inset:0;z-index:100;padding:24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    background:
      radial-gradient(100% 55% at 50% 18%, rgba(63,208,255,.20), transparent 62%),
      radial-gradient(90% 60% at 50% 100%, rgba(155,140,255,.18), transparent 65%),
      #030811;
    transition:opacity .5s ease, visibility .5s ease;
  }
  #splash.gone{opacity:0;visibility:hidden}
  .lplate{
    position:relative;width:88px;height:88px;background:#fff;color:#d4351c;
    clip-path:var(--cham);
    display:grid;place-items:center;font-family:'Chakra Petch',sans-serif;font-size:60px;font-weight:700;line-height:1;
    animation:drop .6s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .lhalo{
    position:absolute;inset:-32px;border-radius:50%;
    background:radial-gradient(circle, rgba(63,208,255,.38), transparent 68%);
    animation:pulse 3.4s ease-in-out infinite;
  }
  .lwrap{position:relative;display:grid;place-items:center}
  .sp-hi{font-size:13px;color:var(--azure);margin:26px 0 0;letter-spacing:.16em;animation:rise .5s .18s ease both;font-family:'Chakra Petch',sans-serif;font-weight:600}
  .sp-name{font-family:'Chakra Petch',sans-serif;font-size:50px;font-weight:700;letter-spacing:.01em;margin:2px 0 0;
           text-shadow:0 0 26px rgba(63,208,255,.5);animation:rise .5s .26s ease both}
  .sp-sub{font-size:16px;color:var(--ice);opacity:.82;margin:8px 0 0;max-width:300px;animation:rise .5s .34s ease both}
  .sp-stats{font-size:13px;color:var(--dim);margin-top:16px;font-family:'Chakra Petch',sans-serif;letter-spacing:.04em;animation:rise .5s .42s ease both}
  .sp-go{
    margin-top:32px;padding:14px 36px;background:linear-gradient(100deg,var(--azure),#7ee8ff);
    color:#031321;font-weight:700;font-size:16px;font-family:'Chakra Petch',sans-serif;letter-spacing:.05em;
    clip-path:var(--chamS);animation:rise .5s .5s ease both;
  }
  .sp-road{position:absolute;left:0;right:0;bottom:0;height:52px;overflow:hidden;
           border-top:1px solid rgba(96,178,255,.28);
           background:linear-gradient(180deg, rgba(63,208,255,.07), transparent)}
  .sp-road:after{
    content:"";position:absolute;top:24px;left:0;width:200%;height:4px;
    background:repeating-linear-gradient(90deg,var(--azure) 0 42px,transparent 42px 92px);
    box-shadow:0 0 14px rgba(63,208,255,.7);
    animation:drive 1.5s linear infinite;
  }
  @keyframes drop{from{transform:translateY(-24px) scale(.86);opacity:0}to{transform:none;opacity:1}}
  @keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  @keyframes drive{from{transform:translateX(0)}to{transform:translateX(-92px)}}
  @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}

  /* ---------- instrument cluster ---------- */
  .cluster{
    position:relative;margin:10px -2px 0;padding:20px 16px 16px;
    background:
      linear-gradient(170deg, rgba(38,82,134,.42), rgba(7,18,34,.9)),
      repeating-linear-gradient(90deg, rgba(96,178,255,.05) 0 1px, transparent 1px 26px);
    clip-path:var(--cham);
  }
  .cluster:before{
    content:"";position:absolute;inset:0;pointer-events:none;clip-path:var(--cham);
    box-shadow:inset 0 0 0 1px var(--hair), inset 0 1px 0 rgba(255,255,255,.07);
  }
  .brk{position:absolute;width:16px;height:16px;border:2px solid var(--azure);opacity:.8}
  .brk.tl{top:8px;left:8px;border-right:0;border-bottom:0}
  .brk.br{bottom:8px;right:8px;border-left:0;border-top:0}
  .hello{font-size:12.5px;color:var(--azure);letter-spacing:.1em;text-align:center;
         font-family:'Chakra Petch',sans-serif;font-weight:600}
  .gaugewrap{position:relative;max-width:340px;margin:6px auto 0}
  .gauge{display:block;width:100%}
  .gaugeval{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
             padding-top:30px;pointer-events:none}
  .gaugeval .pct{font-family:'Chakra Petch',sans-serif;font-size:54px;font-weight:700;line-height:1;
                 text-shadow:0 0 22px rgba(63,208,255,.45)}
  .gaugeval .pct i{font-style:normal;font-size:20px;color:var(--azure);margin-left:2px}
  .readout{text-align:center;margin-top:2px}
  .readout .lab{font-size:12.5px;color:var(--dim)}
  .rank{
    display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:7px 15px;
    background:rgba(63,208,255,.10);clip-path:var(--chamS);
    font-family:'Chakra Petch',sans-serif;font-size:13.5px;font-weight:600;letter-spacing:.03em;
    box-shadow:inset 0 0 0 1px var(--hair);
  }
  .xpbar{height:5px;background:rgba(96,178,255,.14);overflow:hidden;margin-top:12px}
  .xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--azure));
           box-shadow:0 0 12px rgba(63,208,255,.8);transition:width .6s ease}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .stat{background:rgba(8,22,42,.7);clip-path:var(--chamS);padding:11px 8px;text-align:center;
        box-shadow:inset 0 0 0 1px var(--hair)}
  .stat b{display:block;font-family:'Chakra Petch',sans-serif;font-size:22px;font-weight:700;color:var(--azure)}
  .stat span{font-size:11px;color:var(--dim);letter-spacing:.05em}

  /* ---------- tiles & buttons ---------- */
  .menu{display:grid;gap:9px;margin-top:20px}
  .tile{
    position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:var(--skin);clip-path:var(--chamS);padding:14px 16px 14px 18px;
    box-shadow:inset 0 0 0 1px var(--hair), inset 2px 0 0 rgba(63,208,255,.55);
    transition:transform .12s ease, box-shadow .15s ease;
  }
  .tile:active{transform:translateX(2px);box-shadow:inset 0 0 0 1px rgba(120,220,255,.5), inset 3px 0 0 var(--azure)}
  .tile .ico{width:32px;flex:none;display:grid;place-items:center;font-size:19px}
  .tile b{display:block;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:16.5px;letter-spacing:.01em}
  .tile span{display:block;font-size:13px;color:var(--dim);margin-top:1px}
  .tile.boss{
    background:linear-gradient(110deg, rgba(120,30,60,.6), rgba(46,16,70,.75));
    box-shadow:inset 0 0 0 1px rgba(255,120,150,.3), inset 2px 0 0 var(--amber);
  }
  .tile.boss b{color:var(--amber)}

  .btn{
    display:block;width:100%;text-align:center;padding:15px;clip-path:var(--chamS);
    background:linear-gradient(100deg,var(--azure),#79e6ff);color:#031321;
    font-family:'Chakra Petch',sans-serif;font-weight:700;letter-spacing:.04em;margin-top:12px;
  }
  .btn:active{filter:brightness(.9)}
  .btn.ghost{background:rgba(63,208,255,.08);color:var(--ice);box-shadow:inset 0 0 0 1px var(--hair)}
  .btn.go{background:linear-gradient(100deg,var(--go),#7df5cd);color:#012418}
  .row{display:flex;gap:9px}
  .row .btn{flex:1}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:15px;padding:8px 0;margin-bottom:2px}

  /* ---------- topic list ---------- */
  .topic{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
         padding:12px 6px;border-bottom:1px solid rgba(96,178,255,.14)}
  .topic:active{background:rgba(63,208,255,.07)}
  .ring{flex:none}
  .topic .tx{flex:1;min-width:0}
  .topic .tx b{display:block;font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:16px}
  .topic .tx span{font-size:12.5px;color:var(--dim)}

  /* ---------- quiz ---------- */
  .qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px}
  .qhead .meta{font-size:12px;color:var(--dim);letter-spacing:.06em;font-family:'Chakra Petch',sans-serif}
  .clock{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:17px;padding:4px 12px;
         color:var(--azure);background:rgba(63,208,255,.10);clip-path:var(--chamS);
         box-shadow:inset 0 0 0 1px var(--hair)}
  .clock.warn{color:#2a1600;background:var(--amber);box-shadow:none}
  .vbtn{
    display:inline-flex;align-items:center;gap:6px;padding:5px 11px;clip-path:var(--chamS);
    background:rgba(63,208,255,.08);box-shadow:inset 0 0 0 1px var(--hair);
    font-family:'Chakra Petch',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.05em;color:var(--dim);
  }
  .vbtn.on{background:rgba(63,208,255,.2);color:var(--ice);box-shadow:inset 0 0 0 1px var(--azure)}
  .replay{
    display:inline-flex;align-items:center;gap:7px;margin:0 0 14px;padding:7px 13px;clip-path:var(--chamS);
    background:rgba(63,208,255,.08);box-shadow:inset 0 0 0 1px var(--hair);
    font-size:13.5px;color:var(--azure);font-family:'Chakra Petch',sans-serif;font-weight:600;
  }
  .replay:active{background:rgba(63,208,255,.2)}
  .speaking{box-shadow:inset 0 0 0 1px var(--azure), inset 0 0 22px rgba(63,208,255,.15)}
  .prog{height:3px;background:rgba(96,178,255,.16);overflow:hidden;margin-bottom:20px}
  .prog i{display:block;height:100%;background:var(--azure);box-shadow:0 0 12px rgba(63,208,255,.9);transition:width .3s ease}
  .qtext{font-size:20px;font-weight:600;line-height:1.32;margin:0 0 14px}
  .pick{font-family:'Chakra Petch',sans-serif;font-size:12.5px;color:var(--amber);
        letter-spacing:.09em;margin:0 0 12px}
  .scenario{background:rgba(63,208,255,.07);clip-path:var(--chamS);padding:13px 15px;margin:0 0 16px;
            font-size:15px;line-height:1.4;box-shadow:inset 0 0 0 1px var(--hair)}
  .scenario b{display:block;font-family:'Chakra Petch',sans-serif;font-size:12px;color:var(--azure);
              letter-spacing:.1em;font-weight:600;margin-bottom:5px}
  .foot{margin-top:26px;padding-top:16px;border-top:1px solid rgba(96,178,255,.14);
        font-size:12.5px;color:var(--dim);line-height:1.5}
  .opts{display:grid;gap:8px}
  .opts.pics{grid-template-columns:1fr 1fr;gap:10px}
  .opt.pic{flex-direction:column;align-items:center;gap:8px;padding:12px 10px}
  .opt.pic svg{width:100%;max-width:104px;height:auto;display:block}
  .opt.pic .k{align-self:flex-start}
  .opt{
    display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    background:var(--skin);clip-path:var(--chamS);padding:13px 14px;line-height:1.35;
    box-shadow:inset 0 0 0 1px var(--hair);transition:box-shadow .14s ease, background .14s ease;
  }
  .opt:active{box-shadow:inset 0 0 0 1px rgba(120,220,255,.6)}
  .opt .k{
    flex:none;width:24px;height:24px;background:rgba(8,22,42,.85);clip-path:var(--chamS);
    display:grid;place-items:center;font-family:'Chakra Petch',sans-serif;font-size:13px;font-weight:700;
    color:var(--azure);margin-top:1px;box-shadow:inset 0 0 0 1px var(--hair)}
  .opt.sel{box-shadow:inset 0 0 0 2px var(--azure)}
  .opt.sel .k{background:var(--azure);color:#031321}
  .opt.right{background:linear-gradient(165deg, rgba(46,230,168,.22), rgba(6,40,32,.8));
             box-shadow:inset 0 0 0 1px rgba(46,230,168,.7), inset 0 0 26px rgba(46,230,168,.18)}
  .opt.right .k{background:var(--go);color:#012418;box-shadow:none}
  .opt.wrong{background:linear-gradient(165deg, rgba(255,77,99,.2), rgba(44,8,16,.8));
             box-shadow:inset 0 0 0 1px rgba(255,77,99,.7), inset 0 0 26px rgba(255,77,99,.15)}
  .opt.wrong .k{background:var(--stop);color:#fff;box-shadow:none}
  .opt[disabled]{cursor:default}

  .why{margin-top:14px;padding:13px 15px 13px 17px;background:rgba(10,26,48,.8);clip-path:var(--chamS);
       font-size:15.5px;box-shadow:inset 0 0 0 1px var(--hair), inset 3px 0 0 var(--azure)}
  .why b{display:block;font-family:'Chakra Petch',sans-serif;font-size:13px;color:var(--dim);
         font-weight:600;letter-spacing:.05em;margin-bottom:4px}
  .why.ok{box-shadow:inset 0 0 0 1px rgba(46,230,168,.35), inset 3px 0 0 var(--go)}
  .why.ok b{color:var(--go)}
  .why.no{box-shadow:inset 0 0 0 1px rgba(255,77,99,.35), inset 3px 0 0 var(--stop)}
  .why.no b{color:var(--stop)}

  .signbox{display:grid;place-items:center;padding:10px 0 14px;position:relative}
  .signbox:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle, rgba(63,208,255,.20), transparent 66%)}
  .signbox svg{width:154px;height:154px;position:relative;filter:drop-shadow(0 6px 20px rgba(0,0,0,.55))}

  /* ---------- results ---------- */
  .verdict{text-align:center;padding:24px 0 6px}
  .verdict .big{font-family:'Chakra Petch',sans-serif;font-size:66px;font-weight:700;line-height:1;
                text-shadow:0 0 30px rgba(63,208,255,.4)}
  .verdict .big span{font-size:26px;color:var(--dim)}
  .verdict .word{font-family:'Chakra Petch',sans-serif;font-size:21px;font-weight:700;letter-spacing:.14em;margin-top:6px}
  .pass{color:var(--go);text-shadow:0 0 26px rgba(46,230,168,.45)}
  .fail{color:var(--stop);text-shadow:0 0 26px rgba(255,77,99,.4)}
  .breakdown{margin-top:20px}
  .brow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(96,178,255,.14);font-size:15px}
  .brow .nm{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brow .bar{flex:0 0 62px;height:4px;background:rgba(96,178,255,.16);overflow:hidden}
  .brow .bar i{display:block;height:100%}
  .brow .n{width:48px;text-align:right;color:var(--dim);font-size:13px;font-family:'Chakra Petch',sans-serif}

  .ach{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:16px}
  .badge{background:rgba(10,24,44,.6);clip-path:var(--chamS);padding:13px 10px;text-align:center;
         box-shadow:inset 0 0 0 1px rgba(96,178,255,.14);opacity:.4}
  .badge.won{opacity:1;background:linear-gradient(165deg, rgba(255,196,71,.14), rgba(12,26,46,.85));
             box-shadow:inset 0 0 0 1px rgba(255,196,71,.5), inset 0 0 24px rgba(255,196,71,.1)}
  .badge .em{font-size:24px}
  .badge b{display:block;font-family:'Chakra Petch',sans-serif;font-size:14px;font-weight:600;margin-top:5px}
  .badge span{font-size:11.5px;color:var(--dim);display:block;line-height:1.3}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
    background:linear-gradient(100deg,var(--amber),#ffd97a);color:#2a1a00;
    font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:15px;letter-spacing:.03em;
    padding:11px 20px;clip-path:var(--chamS);opacity:0;pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .sticky{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
          background:linear-gradient(180deg,rgba(4,10,20,0),var(--void) 34%);max-width:620px;margin:0 auto}
  .sticky .btn{margin-top:0}
  input[type=date]{
    background:rgba(8,22,42,.85);color:var(--ice);clip-path:var(--chamS);border:0;
    box-shadow:inset 0 0 0 1px var(--hair);padding:12px 14px;font-family:inherit;font-size:16px;width:100%}
  a{color:var(--azure)}
  :focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--amber)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="splash" onclick="closeSplash()">
  <div class="carwrap"><span class="carglow"></span><img id="carSplash" class="car" alt="Dante at the wheel"></div>
  <p class="sp-hi" id="spHi" style="margin-top:14px">Welcome to your theory test garage</p>
  <h1 class="sp-name">Dante</h1>
  <p class="sp-sub" id="spSub">Loading your progress…</p>
  <p class="sp-stats" id="spStats"></p>
  <button class="sp-go">Start revising</button>
  <div class="sp-road" aria-hidden="true"></div>
</div>

<img id="carCorner" class="corner-car" alt="">

<div id="app">

{"c":"attitude","q":"How should you use your headlights at night on an unlit road when another vehicle is coming towards you?","o":["Dip them before they reach you","Keep them on full beam","Switch them off completely","Flash them twice"],"a":0,"e":"Dazzling an oncoming driver blinds them for several seconds. Dip early and only go back to full beam once they've passed."},
{"c":"attitude","q":"You're stationary in traffic and a pedestrian wants to cross between the queuing cars. What should you do?","o":["Keep watching and be ready to stop other movement","Wave them across in front of you","Move forward to close the gap","Edge out to see past the queue"],"a":0,"e":"Never wave anyone across — you can't see the lane beside you, and a passing cyclist or motorcyclist may not stop."},
{"c":"attitude","q":"What's the most important reason not to drive aggressively?","o":["It increases the risk of a collision for everyone","It uses slightly more fuel","It wears the tyres","It annoys passengers"],"a":0,"e":"Anger narrows your judgement and shortens the gaps you leave. Every road rage statistic starts with someone deciding to make a point."},
{"c":"vehicle","q":"What's the legal minimum tread depth for car tyres in the UK?","o":["1.6mm","1.0mm","2.5mm","3.0mm"],"a":0,"e":"1.6mm across the central three-quarters of the tread and around the whole circumference. Below that it's a fine and penalty points per tyre."},
{"c":"vehicle","q":"When should you check your tyre pressures?","o":["When the tyres are cold","Straight after a long motorway drive","Only when a tyre looks flat","Once a year at the MOT"],"a":0,"e":"Hot tyres read high and give you a false answer. Check them cold, at least every couple of weeks, and don't forget the spare."},
{"c":"vehicle","q":"At what age does a car normally need its first MOT test?","o":["Three years old","One year old","Five years old","Ten years old"],"a":0,"e":"Most cars need an MOT from three years old, then annually. Driving without a valid MOT can also invalidate your insurance."},
{"c":"vehicle","q":"Your steering feels vague and the car pulls to one side. What's the most likely cause?","o":["Incorrect tyre pressures or a tyre problem","Low screen wash","A dirty air filter","A flat spare"],"a":0,"e":"Uneven or low pressures affect grip, steering and braking, and wear the tyres out faster. Check pressures first."},
{"c":"vehicle","q":"What should you do with an old car battery, engine oil and used tyres?","o":["Take them to an authorised disposal site","Put them in your household recycling bin","Leave them beside a public recycling point","Take them to any council refuse bin"],"a":0,"e":"They're all hazardous waste. Local authority sites and garages take them — pouring oil down a drain is an offence."},
{"c":"vehicle","q":"How can you reduce the fuel your car uses?","o":["Drive smoothly and avoid harsh acceleration","Carry extra weight for stability","Keep the revs high in low gears","Brake late and hard"],"a":0,"e":"Gentle inputs, reading the road ahead, correct tyre pressures and removing unused roof racks all cut consumption and emissions."},
{"c":"vehicle","q":"What does a catalytic converter do?","o":["Reduces harmful exhaust emissions","Increases engine power","Improves fuel gauge accuracy","Silences the engine completely"],"a":0,"e":"It converts much of the toxic content of exhaust gases into less harmful substances. A failing one will fail the MOT emissions test."},
{"c":"vehicle","q":"You're parking on a hill facing uphill with no kerb. What should you do?","o":["Leave it in first gear and apply the handbrake","Leave it in neutral","Turn the wheels towards the middle of the road","Leave it in reverse with the handbrake off"],"a":0,"e":"Handbrake on, in gear, and turn the wheels so the car would roll away from the road if the brake slipped."},
{"c":"vehicle","q":"What's the main reason for keeping your windscreen washer bottle topped up?","o":["So you can clear the screen and keep good visibility","To cool the engine","To improve wiper life only","To reduce emissions"],"a":0,"e":"Dirty spray from a lorry can blind you in a second. Add screen wash rather than plain water so it doesn't freeze."},
{"c":"vehicle","q":"What's most likely to cause excessive or uneven tyre wear?","o":["Faulty steering alignment or suspension","A worn clutch","Low screen wash","A dirty battery terminal"],"a":0,"e":"Misaligned wheels scrub the tread away on one edge. Get the tracking checked if you see a wear pattern developing."},
{"c":"vehicle","q":"Which of these is a legal requirement before you drive?","o":["That your lights and indicators work correctly","That your car is washed","That you carry a first aid kit","That you carry a warning triangle"],"a":0,"e":"Lights, brakes, tyres, mirrors and washers must all work. First aid kits and triangles are sensible but not compulsory in the UK."},
{"c":"vehicle","q":"How can you help the environment when choosing how to make a short local journey?","o":["Walk, cycle or use public transport instead","Always take the car for speed","Use a larger vehicle","Drive with the windows down"],"a":0,"e":"Cold engines are at their least efficient and most polluting. Short car trips produce the most emissions per mile."},
{"c":"vehicle","q":"Your brake fluid warning light comes on. What should you do?","o":["Stop as soon as it's safe and have it checked","Continue if the brakes still feel normal","Top up the reservoir and carry on regardless","Pump the pedal to restore pressure"],"a":0,"e":"A brake system warning means possible brake failure. Don't gamble on it — get it checked before continuing."},
{"c":"vehicle","q":"When must you use headlights?","o":["At night, and when visibility is seriously reduced","Only on motorways","Only in towns","Only when it rains"],"a":0,"e":"Sidelights alone aren't enough after dark. Use dipped headlights whenever it's dark or visibility drops."},
{"c":"vehicle","q":"What is the purpose of a properly adjusted head restraint?","o":["To reduce neck injury in a collision","To make the seat more comfortable","To hold the seat belt in place","To block the rear view"],"a":0,"e":"The rigid part should be level with the top of your head, not your neck, so it supports your head in a rear-end shunt."},
{"c":"vehicle","q":"Who is responsible for making sure a child under 14 is properly restrained in your car?","o":["You, the driver","The child's parent, wherever they are","The child","Nobody — it's advisory"],"a":0,"e":"The driver is legally responsible for passengers under 14 wearing seat belts or using the correct child restraint."},
{"c":"vehicle","q":"What's the benefit of anti-lock brakes (ABS)?","o":["They help you keep steering control during emergency braking","They reduce your stopping distance on ice","They mean you can brake later in all conditions","They work only in reverse"],"a":0,"e":"ABS stops the wheels locking so you can steer while braking hard. It doesn't shorten stopping distances on loose or icy surfaces."},
{"c":"margins","q":"What is the overall stopping distance at 70mph in good, dry conditions?","o":["96 metres (about 315 feet)","53 metres (about 175 feet)","73 metres (about 240 feet)","36 metres (about 118 feet)"],"a":0,"e":"At 70mph it's 21m thinking plus 75m braking — 96m in total, about the length of 24 cars."},
{"c":"margins","q":"What is the typical overall stopping distance at 30mph?","o":["23 metres (about 75 feet)","12 metres (about 40 feet)","36 metres (about 118 feet)","53 metres (about 175 feet)"],"a":0,"e":"9m thinking plus 14m braking. Worth memorising the set: 12, 23, 36, 53, 73, 96 metres for 20 to 70mph."},
{"c":"margins","q":"In wet weather, how should you adjust your following distance?","o":["At least double the two-second gap","Keep it the same","Halve it to stay in the flow","Add half a second"],"a":0,"e":"Wet roads roughly double stopping distances, so a four-second gap is the minimum. On ice, allow up to ten times the dry distance."},
{"c":"margins","q":"What's the two-second rule?","o":["The minimum time gap to the vehicle in front in good conditions","The time to indicate before turning","How long to wait at a junction","How long to hold the clutch down"],"a":0,"e":"Pick a fixed point, and if you reach it before saying 'only a fool breaks the two-second rule', you're too close."},
{"c":"margins","q":"You're driving in fog. What should you do?","o":["Slow down, use dipped headlights and increase your gap","Use full beam so you can see further","Keep close to the tail lights ahead for guidance","Use sidelights only to avoid dazzling others"],"a":0,"e":"Full beam reflects off fog and makes it worse. Slow down enough to stop within the distance you can actually see to be clear."},
{"c":"margins","q":"What is aquaplaning?","o":["Tyres riding on a film of water and losing contact with the road","Water leaking into the cabin","Wipers failing at speed","Brakes overheating in the rain"],"a":0,"e":"Steering goes light and unresponsive. Ease off the accelerator, don't brake hard, and let the speed drop until the tyres grip again."},
{"c":"margins","q":"After driving through deep water, what should you do?","o":["Test your brakes gently when it's safe","Accelerate hard to dry them","Apply the handbrake at speed","Nothing — they're unaffected"],"a":0,"e":"Wet brakes are much less effective. Drive slowly with light pressure on the pedal to dry them out before you need them."},
{"c":"margins","q":"You're driving on an icy road. What's the main clue that you've lost grip?","o":["The steering feels very light","The engine revs drop","The wipers slow down","The heater stops working"],"a":0,"e":"Light, vague steering and an eerie quietness from the tyres both suggest ice. Reduce speed very gently — no sharp inputs."},
{"c":"margins","q":"How should you brake on a slippery surface?","o":["Gently and in good time, using the highest suitable gear","Firmly and late","Using the handbrake","With the clutch down"],"a":0,"e":"Smooth, early, light braking keeps the tyres rolling. Sudden inputs are what cause skids on low-grip surfaces."},
{"c":"margins","q":"Your car begins to skid with the rear sliding to the right. What should you do?","o":["Ease off the pedals and steer to the right","Brake hard and hold the wheel straight","Steer left to counter it","Pull the handbrake on"],"a":0,"e":"Steer into the skid — the direction the rear has gone — and remove the cause by easing off the accelerator or brake."},
{"c":"margins","q":"When are contraflow systems most likely to catch drivers out?","o":["Because lanes are narrow and speed limits are lower","Because there are no road markings","Because the hard shoulder is wider","Because overtaking is compulsory"],"a":0,"e":"Reduce speed in good time, keep a safe gap, and don't change lanes unnecessarily — there's less room for error."},
{"c":"margins","q":"Why should you leave an extra-large gap when following a motorcyclist on a wet road?","o":["They may brake or swerve to avoid slippery surfaces","They always travel faster","They cannot see behind them","Their brakes are stronger"],"a":0,"e":"Painted lines, drain covers and diesel spills are far more dangerous on two wheels, so riders often move around suddenly."},
{"c":"margins","q":"What effect does coasting (rolling with the clutch down or in neutral) have?","o":["It reduces your control, especially braking and steering","It saves a lot of fuel","It improves grip in the wet","It helps in fog"],"a":0,"e":"You lose engine braking and the ability to accelerate out of trouble. Keep the car in gear, particularly downhill."},
{"c":"margins","q":"You're driving down a long, steep hill. What should you do?","o":["Select a lower gear and use engine braking","Stay in top gear and ride the brakes","Coast in neutral to save fuel","Use the handbrake to slow down"],"a":0,"e":"Constant braking makes brakes fade and lose effectiveness. A lower gear lets the engine hold the car back."},
{"c":"margins","q":"In very hot weather the road surface can become soft. What effect does this have?","o":["Grip and braking are reduced","Tyres last longer","Steering becomes heavier","Stopping distances shorten"],"a":0,"e":"Melting tar reduces tyre grip, so slow down and avoid sudden steering or braking."},
{"c":"margins","q":"What's the safest way to use the brakes when stopping in normal conditions?","o":["Brake early and progressively, easing off at the end","Brake as late as possible","Pump the pedal rapidly","Use the handbrake at the last moment"],"a":0,"e":"Progressive braking is smoother for passengers, kinder to the car, and gives drivers behind far more warning."},
{"c":"hazard","q":"What's the safest way to deal with a hazard you can see developing well ahead?","o":["Slow down early and plan your response","Hold your speed and be ready to brake","Move out to pass it as quickly as possible","Wait until you're closer before deciding"],"a":0,"e":"Early, gentle action gives you options. Late reaction leaves you only one choice — usually braking hard."},
{"c":"hazard","q":"You're approaching a row of parked cars with a ball rolling into the road. What should you expect?","o":["A child may run out after it","A dog is chasing it","Nothing — carry on at the same speed","The road is closed ahead"],"a":0,"e":"Cover the brake and slow right down. Where there's a ball there's often a child who isn't looking at the road."},
{"c":"hazard","q":"You've been prescribed medicine that may cause drowsiness. What should you do?","o":["Check with your doctor or pharmacist before driving","Drive but take extra care","Take a double dose to get it over with","Drink coffee to counteract it"],"a":0,"e":"Driving while impaired by legal medication is still an offence. Ask whether it's safe before you get behind the wheel."},
{"c":"hazard","q":"What should you do if you feel anxious or upset before setting off?","o":["Wait until you have calmed down before driving","Set off slowly and take extra care","Take a quieter route to avoid traffic","Open the windows to get some air"],"a":0,"e":"Strong emotion makes drivers impatient and less observant. Give yourself a few minutes before you start the engine."},
{"c":"hazard","q":"A bus has stopped ahead at a bus stop on your side of the road. What should you do?","o":["Slow down and watch for pedestrians stepping out","Pass close to the bus to save time","Move out only once the bus indicates","Follow the bus closely until it moves off"],"a":0,"e":"People step out from in front of buses without looking. Pedestrians, and the bus pulling away, are both hazards here."},
{"c":"hazard","q":"What does 'covering the brake' mean?","o":["Moving your foot over the brake pedal ready to use it","Pressing the brake lightly at all times","Resting your foot on the pedal while driving","Using the handbrake as well"],"a":0,"e":"It cuts your reaction time when you've spotted a possible hazard, without actually slowing the car."},
{"c":"hazard","q":"You're following a car that keeps braking for no obvious reason. What should you do?","o":["Increase your following distance and stay alert","Overtake as soon as there's a gap","Stay close so you can react quickly","Pull alongside to see what's wrong"],"a":0,"e":"Erratic driving is a hazard in itself — the driver may be lost, distracted or unwell. Give yourself extra space."},
{"c":"hazard","q":"How does alcohol affect your driving?","o":["It slows reactions and creates false confidence","It improves concentration","It only affects you the next day","It has no effect below the limit"],"a":0,"e":"Even small amounts impair judgement while making you feel more capable — the most dangerous combination there is."},
{"c":"hazard","q":"You've been drinking heavily in the evening. When might you still be over the limit?","o":["The following morning","Two hours later only","Never, after a night's sleep","Only if you drink again"],"a":0,"e":"The body clears alcohol slowly, around one unit an hour. Morning-after drink-driving arrests are extremely common."},
{"c":"hazard","q":"Where are you most likely to find hazards you can't see until the last moment?","o":["On narrow country lanes with high hedges","On a straight dual carriageway","In a supermarket car park","On a motorway slip road"],"a":0,"e":"Blind bends, mud, horses, walkers and slow farm vehicles all hide behind hedges. Drive at a speed that lets you stop in the distance you can see to be clear."},
{"c":"hazard","q":"You see a triangular sign with a picture of children. What should you do?","o":["Reduce speed and watch for children near the road","Expect a crossing patrol to stop you","Stop and wait for children to cross","Expect the children to be supervised"],"a":0,"e":"It warns of a school or playground. Children are unpredictable, so be ready to stop."},
{"c":"hazard","q":"What should you do if your concentration begins to drift on a familiar route?","o":["Re-focus, and stop for a break if it continues","Turn the radio up to stay alert","Open a window and carry on","Drive a little faster to stay engaged"],"a":0,"e":"Familiar roads are where drivers switch off. If your mind is wandering, you're not observing — take a break."},
{"c":"hazard","q":"You're approaching a junction where a car is waiting to emerge. What should you consider?","o":["The driver may not have seen you and could pull out","They have to give way, so you can maintain speed","They'll have seen you if your lights are on","They'll only pull out if you slow down"],"a":0,"e":"Right of way is not the same as safety. Watch the front wheels and the driver's head for clues about what they'll do."},
{"c":"hazard","q":"Why are older drivers and pedestrians sometimes more at risk?","o":["Their reactions, hearing or eyesight may be slower","They always drive too fast","They never use crossings","They ignore road signs"],"a":0,"e":"Give them more time at crossings and junctions rather than pressuring them."},
{"c":"hazard","q":"You're on a country road and see mud on the surface near a farm entrance. What should you do?","o":["Slow down — grip is reduced and farm traffic may emerge","Keep to the crown of the road and hold your speed","Brake firmly to test how much grip you have","Change down and accelerate through it"],"a":0,"e":"Mud is slippery, especially in the wet, and signals farm traffic turning in and out."},
{"c":"hazard","q":"What is the effect of using illegal drugs before driving?","o":["Serious impairment and a driving ban if caught","Improved reaction times","No effect if you feel fine","Legal as long as you're under the limit"],"a":0,"e":"There are roadside tests and specific legal limits for drug driving. Penalties match those for drink driving."},
{"c":"vulnerable","q":"How much room should you leave when overtaking a cyclist?","o":["At least as much room as you'd give a car — 1.5 metres or more","About half a metre","Just enough to pass","No specific amount"],"a":0,"e":"The Highway Code asks for at least 1.5m at speeds up to 30mph, and more above that. Wait if you can't give that space."},
{"c":"vulnerable","q":"You're turning left and a cyclist is riding on your inside. What should you do?","o":["Hold back and let the cyclist go first","Turn in front of them, as you're already signalling","Move left to block them before turning","Overtake and then turn across their path"],"a":0,"e":"Cutting across a cyclist on your nearside is one of the most common causes of serious cycling injuries. Wait."},
{"c":"vulnerable","q":"What does a flashing amber beacon on a slow-moving vehicle warn you of?","o":["The vehicle travels much slower than other traffic","The driver is learning","There is an emergency","The vehicle is broken down"],"a":0,"e":"Used by tractors, gritters and mobility scooters on dual carriageways. Slow early — you'll close the gap much faster than you expect."},
{"c":"vulnerable","q":"You're approaching horse riders on a narrow road. What should you do?","o":["Slow right down and pass wide and slowly","Pass quickly to spend less time alongside","Stop and switch off your engine until they pass","Stay close behind until the road widens"],"a":0,"e":"Pass at no more than 10mph and leave at least 2 metres. Horses are easily startled by noise and close, fast vehicles."},
{"c":"vulnerable","q":"What should you look out for when passing parked cars in a residential street?","o":["Doors opening and children stepping out","Overhanging trees","Loose gravel only","Speed cameras"],"a":0,"e":"Leave a door's width where you can, and drop your speed. Look through car windows for movement inside."},
{"c":"vulnerable","q":"A pedestrian is walking on the right-hand side of a country road at night. Why?","o":["So they can see oncoming traffic","Because it's illegal to walk on the left","To be nearer the hedge","Because the ground is flatter"],"a":0,"e":"Walking towards oncoming traffic is the recommended practice where there's no pavement. Give them plenty of room."},
{"c":"vulnerable","q":"Which group of road users is hardest to see at junctions?","o":["Motorcyclists and cyclists","Lorry drivers","Bus drivers","Van drivers"],"a":0,"e":"They're narrow, quick and easily hidden by a windscreen pillar. Take a second look before you pull out."},
{"c":"vulnerable","q":"You see a person with a white stick with red bands. What does this tell you?","o":["They are deaf as well as blind","They are a driving instructor","They are a traffic warden","They have a hearing aid only"],"a":0,"e":"Red bands indicate deafblindness, so they may not hear your vehicle at all. Give them plenty of time to cross."},
{"c":"vulnerable","q":"What should you do when driving past a school where a crossing patrol is showing a STOP sign?","o":["Stop and wait until the patrol has cleared the crossing","Slow down and pass if no children are crossing","Stop only once children are in the road","Treat it as a give way sign"],"a":0,"e":"It's a legal requirement to stop. Only move off once the patrol has returned to the pavement and signalled you on."},
{"c":"vulnerable","q":"Why do motorcyclists sometimes change position within their lane?","o":["To improve their view and avoid surface hazards","To confuse other drivers","Because their bike is faulty","To signal a turn"],"a":0,"e":"They're dealing with potholes, drains and wind. Expect the movement and don't crowd them."},
{"c":"vulnerable","q":"What is a toucan crossing?","o":["A crossing where cyclists and pedestrians cross together","A crossing with no lights","A crossing for horse riders","A crossing only for school children"],"a":0,"e":"Two can cross — cyclists may ride across rather than dismounting. Watch for the higher approach speed of bikes."},
{"c":"vulnerable","q":"Elderly pedestrians are crossing slowly in front of you and the lights turn green. What should you do?","o":["Wait until they have finished crossing","Move off slowly and pass behind them","Edge forward so they hurry across","Move off — the green light gives you priority"],"a":0,"e":"Pedestrians on the crossing keep priority. Rushing someone who can't move quickly is how people get hurt."},
{"c":"vulnerable","q":"You're driving past a group of children playing near the road. What should you do?","o":["Slow down and be ready to stop","Hold your speed but watch them closely","Move to the centre of the road and continue","Stop and wave them across"],"a":0,"e":"Children have poor judgement of speed and distance, and can dart out without warning."},
{"c":"vulnerable","q":"What does a green flashing beacon on a vehicle mean?","o":["A doctor is answering an emergency call","The vehicle is a gritter","It's a slow-moving vehicle","The vehicle is broken down"],"a":0,"e":"Give way when it's safe if you can — they're on their way to a medical emergency."},
{"c":"vulnerable","q":"Where should you expect learner drivers to have difficulty?","o":["At junctions, roundabouts and hill starts","Only on motorways","Only in car parks","Only at night"],"a":0,"e":"Be patient. Stalling and hesitation are normal — pressuring a learner makes it worse, and you were one very recently."},
{"c":"vulnerable","q":"A powered mobility scooter is travelling along the road ahead at low speed. What should you do?","o":["Be patient and pass only when it's safe with plenty of room","Pass close by to get past quickly","Follow closely so they know you're there","Expect them to pull onto the pavement"],"a":0,"e":"They're entitled to use the road and are extremely vulnerable. Treat them like any slow, fragile vehicle."},
{"c":"others","q":"You're overtaking a long lorry on a dual carriageway. What should you be aware of?","o":["It takes far longer than overtaking a car, so you need a much bigger gap","Lorries always slow down to help","You can cut back in immediately","Lorries have shorter stopping distances"],"a":0,"e":"You may be alongside for a long stretch. Only start if you can see the whole move through, and don't pull back in until the lorry appears in your mirror."},
{"c":"others","q":"A lorry is turning left at a roundabout but has moved out to the right first. Why?","o":["It needs the extra room to get round the corner","The driver has made a mistake","It's going straight on","It's letting you pass on the left"],"a":0,"e":"Long vehicles swing out to take a tight turn. Never move up the inside of one that's positioned oddly — that gap will close."},
{"c":"others","q":"What should you do when following a bus that's approaching a stop?","o":["Hold back and be ready for it to pull in and out","Overtake on the inside as it slows","Stay close so you can pass the moment it stops","Expect passengers to wait until it moves off"],"a":0,"e":"Passengers may cross in front of it and the bus may pull away. Give way to a bus signalling to move off where safe."},
{"c":"others","q":"You're behind a tractor on a narrow road. What's the safest approach?","o":["Stay well back until you have a long, clear view to overtake","Overtake on a bend","Flash to make it pull over","Follow closely to pressure it"],"a":0,"e":"Tractors are wide, slow and may turn into a field without much warning. Patience costs you a minute at most."},
{"c":"others","q":"Why are vehicles towing caravans affected more by strong side winds?","o":["The large flat sides catch the wind and can cause snaking","They are heavier","They have smaller wheels","They have poor brakes"],"a":0,"e":"Give them a wide berth when overtaking, especially on exposed bridges and open stretches."},
{"c":"others","q":"What should you do before overtaking a motorcyclist who is riding slowly in the centre of the lane?","o":["Wait until there's plenty of room and they've seen you","Pass within the same lane where it's wide enough","Move up close to encourage them to move left","Overtake on their nearside"],"a":0,"e":"A rider in the middle of the lane is claiming space for a reason. Change lanes fully to pass."},
{"c":"others","q":"Trams are running on the road ahead. What should you remember?","o":["Trams can't steer around you, so give way","They must give way to cars","They stop very quickly","They always use a separate road"],"a":0,"e":"Trams are on fixed rails and take a long distance to stop. The rails themselves are slippery, especially for two-wheelers."},
{"c":"others","q":"What extra hazard does a vehicle with a long load create?","o":["It may swing out at junctions and bends","It uses more fuel","It has brighter lights","It always travels slowly"],"a":0,"e":"Long or projecting loads must be marked, but the real risk is the swing — stay back and don't try to squeeze past."},
{"c":"others","q":"You're driving behind a large vehicle and can't see its mirrors. What does this mean?","o":["The driver can't see you","Your lights are off","The lorry is reversing","You should overtake now"],"a":0,"e":"If you can't see the mirror, the driver can't see you. Drop back until you can."},
{"c":"others","q":"Why should you take extra care when passing a horse box or livestock transporter?","o":["The load can move and unbalance the vehicle","They accelerate very quickly","They have no brakes","They are exempt from speed limits"],"a":0,"e":"A shifting animal load makes the vehicle less stable, so give it room and pass smoothly."},
{"c":"others","q":"What should you do if a bus is stopped in a bus lane and you need to pass?","o":["Check the sign to see whether the lane is open to you","You may always use a bus lane to pass a stopped bus","Wait behind the bus until it moves off","Cross the solid white line to pass on the right"],"a":0,"e":"Bus lane signs give the hours of operation. Outside those hours you may use it, but check before you do."},
{"c":"others","q":"An articulated lorry is reversing into a yard across the road. What should you do?","o":["Wait patiently — never pass behind or in front","Pass in front of the cab while it's stationary","Pass behind the trailer as it swings out","Flash your headlights to show you're waiting"],"a":0,"e":"The driver has huge blind spots and the trailer sweeps a wide arc. Hold back until the manoeuvre is finished."},
{"c":"handling","q":"When may you use hazard warning lights while moving?","o":["On a motorway or dual carriageway to warn of a hazard or queue ahead","Whenever you park illegally","When driving slowly in fog","To thank another driver"],"a":0,"e":"Use them briefly to warn traffic behind of an obstruction ahead, then switch them off."},
{"c":"handling","q":"What should you do when driving on a road with traffic calming humps?","o":["Keep your speed low and even through the section","Brake at each hump and accelerate between them","Straddle the humps with one wheel on the kerb","Drive along the centre line to avoid them"],"a":0,"e":"Accelerating between humps wastes fuel, wears the car and defeats the point — the area has them for a reason."},
{"c":"handling","q":"You're driving at night on a single carriageway. When should you use full beam?","o":["When the road ahead is clear of other vehicles","When following another car","Whenever it is dark","Only in built-up areas"],"a":0,"e":"Dip for oncoming traffic and when following, because full beam dazzles through mirrors too."},
{"c":"handling","q":"What does a 'box junction' with yellow criss-cross markings mean?","o":["Don't enter unless your exit is clear","Stop and give way","Parking is allowed","You may wait for a gap in the box"],"a":0,"e":"The one exception: you may wait in the box when turning right and you're only held up by oncoming traffic."},
{"c":"handling","q":"You're driving through a tunnel. What should you do before entering?","o":["Remove sunglasses and check your fuel and radio","Switch off your lights","Increase speed","Use full beam"],"a":0,"e":"Take off sunglasses, switch on dipped headlights, tune in to any announced radio channel and keep a safe gap."},
{"c":"handling","q":"What should you do when driving on a road with a series of sharp bends signed as such?","o":["Reduce speed before the bends and stay in your lane","Brake hard in each bend","Use the whole road width","Coast in neutral"],"a":0,"e":"Braking should be finished before you turn in. Braking mid-bend unsettles the car and can cause a skid."},
{"c":"handling","q":"When driving in heavy rain, why should you keep a much larger gap?","o":["Stopping distances are roughly doubled and spray reduces visibility","Rain makes your engine slower","Your brakes work better","Other drivers go faster"],"a":0,"e":"Four seconds minimum. Spray from lorries can also blind you momentarily at exactly the wrong time."},

{"c":"signs","s":"two_way","q":"What does this warning sign mean?","o":["Two-way traffic ahead","Dual carriageway ahead","Overtaking permitted","End of one-way street"],"a":0,"e":"Often where a dual carriageway ends or a one-way system finishes. Don't stray over the centre line."},

{"c":"signs","s":"no_stopping","q":"What does this sign mean?","o":["No stopping — a clearway","No waiting","No parking on the verge","End of restriction"],"a":0,"e":"You must not stop at all, even to drop someone off, except in an emergency."},
{"c":"signs","s":"no_waiting","q":"What does this sign mean?","o":["No waiting","No stopping at any time","Parking permitted","No entry"],"a":0,"e":"You may stop briefly to set down or pick up passengers, but you can't wait or park."},
{"c":"signs","s":"one_way","q":"What does this sign mean?","o":["One-way street in the direction of the arrow","Traffic merges from the right","Keep right","Ahead only"],"a":0,"e":"Rectangular signs give information. Don't confuse this with the blue 'ahead only' circle, which is an order."},
{"c":"signs","q":"What shape are signs that give an order you must obey?","o":["Circular","Triangular","Rectangular","Octagonal"],"a":0,"e":"Circles order, triangles warn, rectangles inform. A red ring means don't; a blue circle means do."},
{"c":"signs","q":"What colour are motorway direction signs?","o":["Blue with white lettering","Green with white lettering","White with black lettering","Brown with white lettering"],"a":0,"e":"Green signs are primary routes, white with black borders are local roads, and brown signs point to tourist attractions."},
{"c":"signs","q":"You see a temporary road sign with a yellow background. What does that mean?","o":["It's a temporary sign, often for roadworks or an event","It's advisory only","It applies to lorries only","It applies at night only"],"a":0,"e":"Yellow-backed signs still carry the same legal force as the permanent version when they show an order."},
{"c":"signs","q":"What does a triangular sign with a red border warn of?","o":["A hazard ahead","An order you must obey","Information about a route","The end of a restriction"],"a":0,"e":"The picture inside tells you what the hazard is, and any plate underneath adds distance or detail."},
{"c":"signs","q":"What does a white sign with a red border and a number inside a circle mean?","o":["A maximum speed limit you must not exceed","A recommended speed","A minimum speed","A distance in miles"],"a":0,"e":"It applies until you see a different limit sign. Repeater signs along the road confirm it."},
{"c":"signs","q":"What does a zig-zag line on the approach to a pedestrian crossing mean?","o":["No parking or overtaking within the zig-zag area","Give way to traffic from the right","Cyclists only","The road narrows"],"a":0,"e":"The zig-zags keep the crossing visible. Parking or overtaking there hides pedestrians from other drivers."},
{"c":"signs","q":"What does a blue circle with a white bicycle mean?","o":["A route for cycles only","No cycling","Cycles may be present","Cycle parking"],"a":0,"e":"Blue circle means mandatory. If it's a red-ringed bicycle, cycling is prohibited."},
{"c":"signs","q":"What does an arm signal — right arm extended and moving up and down — from a driver mean?","o":["I intend to slow down or stop","I intend to turn right","I intend to move off","I am letting you pass"],"a":0,"e":"Arm signals matter where indicators might be missed, such as at a crossing or when a bulb has failed."},
{"c":"signs","q":"What does a red flashing light signal at a level crossing mean?","o":["Stop — a train is approaching","Proceed slowly","The barrier is broken","Give way to pedestrians"],"a":0,"e":"If the lights keep flashing after a train has gone, another one is coming. Stay put until they stop."},
{"c":"signs","q":"You see a sign with a brown background. What does it point to?","o":["A tourist attraction","A motorway service area","A diversion route","A weight restriction"],"a":0,"e":"Brown means leisure and tourism. Blue means motorway, green means primary route, white means local road."},
{"c":"signs","q":"What does a lane marking of double yellow lines at the kerb mean?","o":["No waiting at any time","No stopping at any time","Loading only","Parking for permit holders"],"a":0,"e":"Double yellows ban waiting, but you can usually load or unload unless there are kerb blips showing loading restrictions."},
{"c":"alertness","q":"You're driving and a wasp flies into the car. What should you do?","o":["Stop in a safe place and deal with it","Swat at it while driving","Open the window and keep driving fast","Brake hard to distract it"],"a":0,"e":"Any distraction inside the car is a hazard. Pull over somewhere safe and legal before dealing with it."},
{"c":"alertness","q":"When is it safe to eat or drink at the wheel?","o":["It isn't — stop somewhere safe if you need to","At traffic lights","On a straight, empty road","In slow-moving traffic"],"a":0,"e":"You need both hands and full attention. Spilling a hot drink in your lap at 40mph is how people lose control."},
{"c":"alertness","q":"You're driving a long distance. How often should you take a break?","o":["At least every two hours","Every five hours","Only when you feel exhausted","Only if you're over 70"],"a":0,"e":"A break of at least 15 minutes every two hours is the advice. Tiredness builds long before you notice it."},
{"c":"alertness","q":"Before changing lanes on a dual carriageway, what should you do?","o":["Mirrors, signal, then a blind-spot check before moving","Signal, move over, then check your mirrors","Check your mirrors and move if it looks clear","Move over gradually so other drivers notice"],"a":0,"e":"A vehicle can sit in your blind spot for miles. The shoulder check is what catches it."},
{"c":"alertness","q":"Why should you take extra care when driving somewhere completely new to you?","o":["You'll be navigating as well as driving, which splits your attention","The roads are more dangerous","Speed limits are different","Your insurance may not cover it"],"a":0,"e":"Plan the route beforehand, and if you're unsure, pull over somewhere safe to check rather than reading signs at the last second."},
{"c":"alertness","q":"You've just been overtaken and the car has pulled in close in front. What should you do?","o":["Ease off to restore your safety gap","Brake firmly to open a gap quickly","Stay close so nobody else can pull in","Move out and overtake them back"],"a":0,"e":"Ease off gently and rebuild the gap. Retaliating turns one bad bit of driving into two."},

{"c":"attitude","q":"You're driving a slow vehicle on a narrow road with a long queue behind. What should you do?","o":["Pull over where it's safe and let them pass","Keep going and let them overtake when they can","Wave them past when the road looks clear","Speed up until the queue clears"],"a":0,"e":"The Highway Code asks slower drivers to pull in where possible. A frustrated queue is a queue full of risky overtakes."},
{"c":"attitude","q":"When should you use your indicators?","o":["In good time, whenever they'd help other road users","Only when turning right","Only if traffic is behind you","After you start the manoeuvre"],"a":0,"e":"Signal early enough to be useful but not so early it misleads. And cancel it afterwards."},
{"c":"attitude","q":"You're waiting to turn right and traffic is building up behind you. What should you do?","o":["Wait for a safe gap, however long it takes","Take the next small gap","Pull out and make them stop","Reverse and go another way"],"a":0,"e":"Pressure from behind is not a reason to accept an unsafe gap. It's your licence and your responsibility."},
{"c":"attitude","q":"Why shouldn't you drive with your front fog lights on in clear weather?","o":["They dazzle other drivers unnecessarily","They use too much fuel","They're illegal on all roads","They damage the bulbs"],"a":0,"e":"Same as rear fogs — they exist for seriously reduced visibility and should be switched off as soon as it clears."},
{"c":"attitude","q":"A cyclist has pulled into the middle of the lane ahead of you at a narrow pinch point. What should you do?","o":["Hold back until the road is wide enough to pass safely","Pass them within the lane, keeping well left","Move up close so they know you want past","Expect them to move over once you signal"],"a":0,"e":"Riders take the centre of the lane where there isn't room to be passed safely. Wait for the road to open up."},
{"c":"vehicle","q":"What does a red warning light on the dashboard usually mean?","o":["Something serious — stop as soon as it's safe and investigate","It's advisory only","It relates to the radio","It will clear itself"],"a":0,"e":"Red means stop and check; amber generally means get it looked at soon. Check the handbook for the specific symbol."},
{"c":"vehicle","q":"How can you tell if your shock absorbers are worn?","o":["The car continues to bounce after you press down on a corner","The steering wheel is stiff","The engine is noisy","The brakes squeal"],"a":0,"e":"Worn dampers let the wheels lose contact with the road, which affects braking, cornering and grip."},
{"c":"vehicle","q":"Why should you check your mirrors and seat position before starting a journey?","o":["So you can see clearly and reach the controls comfortably","To save fuel","To reduce tyre wear","To satisfy the MOT"],"a":0,"e":"Adjust the seat first, then the mirrors to match. Never do either while the car is moving."},
{"c":"vehicle","q":"What's the effect of under-inflated tyres?","o":["Poorer handling, longer stopping distances and more fuel used","Better grip in the wet","Shorter stopping distances","No effect below 40mph"],"a":0,"e":"They also wear out faster on the shoulders and are more likely to overheat and blow out at speed."},
{"c":"vehicle","q":"When should you switch off your engine while waiting?","o":["If you're likely to be stationary for more than a couple of minutes","Only when parked on private land","Every time you stop at traffic lights","Only once the engine is fully warmed up"],"a":0,"e":"Idling wastes fuel and pollutes, and leaving an engine running unnecessarily on a public road is an offence."},
{"c":"vehicle","q":"What's the most likely cause of the brakes pulling to one side?","o":["A fault in the braking system that needs checking","Worn wiper blades","Low screen wash","A dirty windscreen"],"a":0,"e":"Uneven braking is dangerous under hard stops. Get it diagnosed rather than driving around it."},
{"c":"vehicle","q":"Where is the safest place for a rear-facing baby seat?","o":["In the back, or in the front only if the airbag is deactivated","Front seat with the airbag active","On the parcel shelf","On a passenger's lap"],"a":0,"e":"A deploying airbag can be fatal to a rear-facing infant. If you must use the front, the airbag has to be switched off."},
{"c":"vehicle","q":"What's the purpose of the vehicle's crumple zones?","o":["To absorb impact energy and protect the occupants","To make the car lighter","To improve fuel economy","To reduce wind noise"],"a":0,"e":"They're designed to deform. Damage that looks dramatic may be the car doing exactly its job."},
{"c":"margins","q":"What's the overall stopping distance at 50mph in good conditions?","o":["53 metres (about 175 feet)","36 metres (about 118 feet)","73 metres (about 240 feet)","23 metres (about 75 feet)"],"a":0,"e":"15m thinking plus 38m braking. Notice how it grows far faster than the speed does."},
{"c":"margins","q":"What's the overall stopping distance at 40mph in good conditions?","o":["36 metres (about 118 feet)","23 metres (about 75 feet)","53 metres (about 175 feet)","12 metres (about 40 feet)"],"a":0,"e":"12m thinking plus 24m braking. Going from 30 to 40mph adds over half again to your total."},
{"c":"margins","q":"Which part of the stopping distance is affected by tiredness or distraction?","o":["The thinking distance","The braking distance","Neither","Both equally"],"a":0,"e":"Reaction time stretches, so you travel further before the brakes even come on. Tyres and road surface affect the braking part."},
{"c":"margins","q":"How much can stopping distances increase on an icy road?","o":["Up to ten times the normal distance","Twice the normal distance","They stay the same","Half the normal distance"],"a":0,"e":"On ice you need an enormous gap and feather-light inputs. Even then, stopping may simply not be possible."},
{"c":"margins","q":"You're overtaking on a country road and the vehicle ahead speeds up. What should you do?","o":["Drop back and abandon the overtake","Keep accelerating to complete the move","Hold position alongside until they slow","Move back in front of them quickly"],"a":0,"e":"Never commit to an overtake you can't finish. Back off and wait for a better opportunity."},
{"c":"margins","q":"Why should you leave extra space when following a large vehicle in the rain?","o":["Spray from its wheels badly reduces your visibility","It brakes much harder","It accelerates faster","It has no brake lights"],"a":0,"e":"You also need the extra distance to see round it. If you can't see the road ahead, you can't plan."},
{"c":"margins","q":"Where are you most likely to find black ice?","o":["On shaded roads, bridges and exposed high ground","In town centres","In tunnels","On motorway slip roads only"],"a":0,"e":"Bridges freeze first because cold air passes underneath. A road that looks merely wet in freezing temperatures may not be."},
{"c":"margins","q":"What should you do if your tyre blows out at speed?","o":["Hold the steering firmly, ease off the accelerator and slow gradually","Brake hard immediately","Steer sharply to the verge","Pull the handbrake"],"a":0,"e":"Let the car slow itself, keep it straight, and pull off the road well clear of traffic when you can."},
{"c":"hazard","q":"You see a cyclist ahead glance over their right shoulder. What might this mean?","o":["They may be about to move out or turn right","They're checking the road surface behind them","They want you to overtake","They're about to stop at the kerb"],"a":0,"e":"A shoulder check is usually the first sign of a manoeuvre. Hang back and give them room."},
{"c":"hazard","q":"What should you do when approaching a humpback bridge?","o":["Slow down and be ready for oncoming traffic you can't see","Keep to the centre of the road and hold your speed","Accelerate so you're over it quickly","Move to the crown of the bridge before looking"],"a":0,"e":"You have no view of the far side, and the road may be single track over the bridge itself."},
{"c":"hazard","q":"You're driving at night and an oncoming car's headlights dazzle you. What should you do?","o":["Slow down and look towards the left edge of the road","Look directly at the lights so your eyes adjust","Flash your own headlights back at them","Switch to full beam until they've passed"],"a":0,"e":"Use the nearside line or kerb as your guide until your eyes recover. Don't stare into the lights."},
{"c":"hazard","q":"What does the presence of a 'horses' warning sign mean for your driving?","o":["Slow right down and pass wide and quietly if you meet any","Sound your horn so riders know you're there","Expect riders to pull onto the verge for you","Continue as normal — the rider will control the horse"],"a":0,"e":"A startled horse can go anywhere, including into your path or the path of oncoming traffic."},
{"c":"hazard","q":"A car ahead has its right indicator on and is slowing near a row of houses. What should you anticipate?","o":["It may stop and turn across your path","It will pull over to the left","It is about to overtake","It has a faulty indicator"],"a":0,"e":"Ease off and hold back. Don't try to squeeze past a vehicle that's signalling to turn right."},
{"c":"hazard","q":"Why are junctions on a hill particularly hazardous?","o":["Your view may be restricted and vehicles can roll back","Gears wear faster","Brakes fail on hills","Signals don't work uphill"],"a":0,"e":"Leave extra room behind a car doing a hill start, and creep forward carefully if a crest hides your view."},

{"c":"vulnerable","q":"What should you do before opening your car door after parking on the road?","o":["Check mirrors and over your shoulder for cyclists and traffic","Open it quickly","Rely on your mirrors alone","Open it and listen"],"a":0,"e":"The 'Dutch reach' — opening with the hand furthest from the door — turns your body and forces the check naturally."},
{"c":"vulnerable","q":"At a crossroads, who should you give priority to when turning?","o":["Pedestrians already crossing the road you're turning into","Nobody — you have priority","Only cars","Only cyclists"],"a":0,"e":"Pedestrians crossing or waiting to cross at a junction have priority under the Highway Code hierarchy."},
{"c":"vulnerable","q":"A vehicle displaying a disabled badge is parked awkwardly ahead. What should you do?","o":["Be patient — the driver may need more time and space","Pass close so you don't block the road","Wait behind and give a short horn note","Expect them to move as soon as they see you"],"a":0,"e":"Getting in and out may take a while. Give them room and wait."},

{"c":"vulnerable","q":"You're approaching a pedestrian crossing and a bus is stopped in the lane beside you. What should you do?","o":["Slow down — someone may step out from in front of the bus","Pass the bus quickly while the crossing is clear","Hold your speed but watch the bus's mirrors","Expect the bus to move off before you reach it"],"a":0,"e":"Your view is blocked, so treat the gap as if someone is about to walk out of it."},

{"c":"vulnerable","q":"Where should you look for cyclists at a roundabout?","o":["In the left-hand lane, even if they're going all the way round","Only in the right lane","Only at the exit","On the pavement"],"a":0,"e":"Cyclists often stay left for safety. Never cut across one as you leave the roundabout."},
{"c":"others","q":"You're approaching a school bus with hazard lights on. What should you do?","o":["Slow down and watch for children getting off","Pass quickly while the bus is stationary","Expect the bus to move off immediately","Treat it as an ordinary parked vehicle"],"a":0,"e":"Children crossing in front of or behind a bus is one of the most common school-run collisions."},

{"c":"others","q":"What should you do if a lorry is overtaking you on a motorway?","o":["Ease off slightly to let it complete the move","Hold your speed so the manoeuvre finishes sooner","Move over into the right-hand lane","Brake firmly to open a gap"],"a":0,"e":"A lorry overtake takes a long time. Helping it finish clears the lane for everyone."},

{"c":"motorway","q":"What should you do if you feel tired while driving on the motorway?","o":["Leave at the next services and take a proper break","Open the window","Turn the music up","Increase your speed"],"a":0,"e":"Motorway monotony makes tiredness worse. A short nap plus caffeine is far more effective than fresh air."},

{"c":"rules","q":"When is it legal to drive in a lane reserved for buses and cycles?","o":["Outside the hours shown on the sign, or if your vehicle is listed","At any time","Only on Sundays","Only when overtaking"],"a":0,"e":"Read the sign — hours and permitted vehicles vary between one street and the next."},
{"c":"rules","q":"You're approaching a junction with the road marked 'Give Way' but no traffic is coming. What should you do?","o":["Slow down, look properly, and continue if it's genuinely clear","Stop completely behind the line every time","Keep your speed if the road looks clear","Emerge and expect others to slow for you"],"a":0,"e":"You don't have to stop, but you do have to be able to stop. Approach at a speed that lets you."},
{"c":"rules","q":"Where must you not overtake?","o":["Approaching a bend, brow of a hill or pedestrian crossing","On a dual carriageway","In the right-hand lane","On a straight road"],"a":0,"e":"Also avoid overtaking near junctions, level crossings, or wherever you'd have to cross double white lines."},
{"c":"rules","q":"What's the rule about stopping on a clearway?","o":["You must not stop at all, except in an emergency","You may stop for two minutes","You may stop to set down passengers","You may stop outside rush hour"],"a":0,"e":"Urban clearways allow brief stops to pick up or set down; a full clearway does not."},
{"c":"rules","q":"At a crossroads with no signs or markings, who has priority?","o":["Nobody — approach with caution and be ready to give way","Traffic from the right","Traffic going straight on","The larger vehicle"],"a":0,"e":"Unmarked crossroads are exactly where assumptions cause collisions. Slow right down and make eye contact."},

{"c":"signs","s":"lc_barrier","q":"What does this warning sign mean?","o":["Level crossing with a barrier or gate ahead","Level crossing without a barrier","A toll booth ahead","A car park entrance"],"a":0,"e":"Never zigzag round a lowering barrier. If the amber light and alarm start, stop behind the line."},
