{"c":"incidents","q":"What should you do if you see a vehicle displaying a plain orange rectangle on the back?","o":["It's carrying hazardous goods — keep clear and report the exact markings if there's an incident","It's a slow vehicle","It's a driving school car","It's carrying livestock"],"a":0,"e":"Hazard plates tell the emergency services what they're dealing with. Never approach a spillage yourself."},
{"c":"incidents","q":"A casualty is in shock after a collision. What should you do?","o":["Keep them warm, calm and still, and don't give them anything to eat or drink","Give them a hot sweet tea","Get them walking around","Leave them alone"],"a":0,"e":"Reassure them constantly and keep checking their breathing until the ambulance arrives."},
{"c":"incidents","q":"You break down at a level crossing and the alarm starts. What should you do?","o":["Get everyone out and clear of the crossing immediately, then phone the signal operator","Stay in the car and hope","Push the car forward alone","Wait for the train to pass"],"a":0,"e":"People first, always. Use the railway telephone by the crossing — the number and instructions are on the box."},
{"c":"loading","q":"Who is responsible for making sure a vehicle isn't overloaded?","o":["The driver","The manufacturer","The owner of the load","The insurer"],"a":0,"e":"You're responsible for the load and its security every time you drive, even if someone else packed it."},
{"c":"loading","q":"How does a heavy load in the boot affect your car?","o":["It changes the handling and increases stopping distance","It improves grip on all wheels equally","It makes the steering heavier only","It has no effect"],"a":0,"e":"You may also need to adjust headlight aim and tyre pressures — check the handbook for laden settings."},
{"c":"loading","q":"What's the main danger of a roof rack load?","o":["It raises the centre of gravity and affects stability, especially in wind","It improves fuel economy","It makes the car quieter","It reduces braking distance"],"a":0,"e":"Distribute the weight evenly, secure it properly, and take the rack off when you're not using it to save fuel."},
{"c":"loading","q":"You're towing a caravan and it starts to snake from side to side. What should you do?","o":["Ease off the accelerator gently and slow down gradually","Brake hard immediately","Accelerate to straighten it","Steer sharply the other way"],"a":0,"e":"Harsh braking or steering makes snaking worse. Let the speed fall away and the outfit will settle."},
{"c":"loading","q":"What is a stabiliser used for when towing?","o":["To help keep a trailer steady in crosswinds and at speed","To increase towing speed limits","To replace the handbrake","To carry extra weight"],"a":0,"e":"It helps, but it doesn't cure bad weight distribution. Load heavy items low and over the axle."},
{"c":"loading","q":"Where should the heaviest items be placed in a trailer?","o":["Low down and over or just ahead of the axle","At the very back","At the very front, high up","On one side"],"a":0,"e":"Correct nose weight keeps the outfit stable. Too much weight at the rear is what starts snaking."},
{"c":"loading","q":"You're carrying a child under three in the car. What must they use?","o":["A correct child restraint for their weight and height","An adult seat belt","Nothing, if the journey is short","A booster cushion only"],"a":0,"e":"A rear-facing restraint must never be used in a front seat with an active airbag."},
{"c":"loading","q":"How should you secure a load carried inside the vehicle?","o":["So it can't move or fly forward in a sudden stop","Loosely so it can settle","On the parcel shelf","Against the windscreen"],"a":0,"e":"An unsecured object becomes a projectile in a crash. Heavy items belong in the boot, tied down."},
{"c":"loading","q":"What's the effect of a heavy load on your fuel consumption?","o":["It increases it","It decreases it","No effect","It only matters uphill"],"a":0,"e":"More weight and more drag both cost fuel. Empty roof boxes are the classic wasted expense."},
{"c":"loading","q":"When towing, what must you make sure about the trailer's lights?","o":["They work and match the car's indicators and brake lights","They are brighter than the car's","They only need to work at night","They are optional on short trips"],"a":0,"e":"Check them before every journey, along with tyres, number plate and the security of the coupling."},
{"c":"signs","s":"stop","q":"What does this sign mean?","o":["Stop and give way","Give way to traffic on the major road","No entry","End of restriction"],"a":0,"e":"The only octagonal sign on UK roads, so you can recognise it even if it's covered in snow. You must stop completely at the line."},
{"c":"signs","s":"give_way","q":"What does this sign mean?","o":["Give way to traffic on the major road","Stop completely","No through road","Roundabout ahead"],"a":0,"e":"Slow down, be ready to stop, and only emerge when you can do so without making anyone else change speed or direction."},
{"c":"signs","s":"national_speed","q":"What does this sign mean?","o":["National speed limit applies","End of all restrictions except speed","No vehicles","Derestricted parking"],"a":0,"e":"On a single carriageway that's 60mph for cars, on a dual carriageway or motorway 70mph. It doesn't mean 'go as fast as you like'."},
{"c":"signs","s":"no_entry","q":"What does this sign mean?","o":["No entry for vehicular traffic","Give way","No stopping","One way street"],"a":0,"e":"Often marks the exit of a one-way street. Going past it means driving straight into oncoming traffic."},
{"c":"signs","s":"no_overtaking","q":"What does this sign mean?","o":["No overtaking","Two-way traffic ahead","Overtaking lane ahead","End of dual carriageway"],"a":0,"e":"A red ring means the sign is an order telling you what you must not do. This one applies until an 'end of no overtaking' sign."},
{"c":"signs","s":"min_speed","q":"What does this blue sign with '30' mean?","o":["Minimum speed 30mph","Maximum speed 30mph","Advisory speed 30mph","Speed camera zone"],"a":0,"e":"Blue circles give positive instructions. A minimum speed sign with a red diagonal through it marks the end of that requirement."},
{"c":"signs","s":"ahead_only","q":"What does this sign mean?","o":["Ahead only","Overhead bridge","One way traffic","Keep left"],"a":0,"e":"Blue circle, white arrow: something you must do. You can't turn left or right here."},
{"c":"signs","s":"no_motor","q":"What does this sign mean?","o":["No motor vehicles","No cars, but motorcycles allowed","Motorcycle parking","End of motorway"],"a":0,"e":"Common on pedestrianised streets and greenways. Bicycles are still allowed through."},
{"c":"signs","s":"crossroads","q":"What does this warning sign mean?","o":["Crossroads ahead","Level crossing ahead","Hospital ahead","T-junction ahead"],"a":0,"e":"Triangles warn. The arms show the relative importance of the roads — a bigger cross means both roads matter."},
{"c":"signs","s":"t_junction","q":"What does this warning sign mean?","o":["T-junction ahead","Crossroads ahead","No through road","Traffic merging"],"a":0,"e":"The road you're on ends at a junction with a road going left and right. Slow down and be ready to give way."},
{"c":"signs","s":"roundabout","q":"What does this warning sign mean?","o":["Roundabout ahead","Mini-roundabout","Sharp bends ahead","Turn left ahead"],"a":0,"e":"Start slowing early and pick your lane based on the exit you want, using the direction signs on the approach."},
{"c":"signs","s":"signals","q":"What does this warning sign mean?","o":["Traffic signals ahead","Level crossing","Traffic merges","Roadworks"],"a":0,"e":"Useful where the lights are hidden round a bend or over a hill — expect to stop."},
{"c":"signs","s":"slippery","q":"What does this warning sign mean?","o":["Slippery road ahead","Loose chippings","Roadworks ahead","Steep hill"],"a":0,"e":"Reduce speed gently and avoid harsh braking or steering until you're past."},
{"c":"signs","s":"ped_crossing","q":"What does this warning sign mean?","o":["Pedestrian crossing ahead","Pedestrian zone","School crossing patrol","No pedestrians"],"a":0,"e":"Be ready to slow or stop, and don't overtake as you approach a crossing."},
{"c":"signs","s":"hill_down","q":"What does this warning sign mean?","o":["Steep hill downwards","Steep hill upwards","Uneven road","Road narrows"],"a":0,"e":"Select a lower gear before the descent so engine braking does the work instead of your brakes."},
{"c":"signs","s":"humps","q":"What does this warning sign mean?","o":["Road hump ahead","Uneven surface","Bridge ahead","Loose chippings"],"a":0,"e":"Slow to the speed the humps are designed for — usually 20mph — rather than braking at each one."},
{"c":"signs","s":"two_way","q":"What does this warning sign mean?","o":["Two-way traffic ahead","Dual carriageway ahead","Overtaking permitted","End of one-way street"],"a":0,"e":"Often where a dual carriageway ends or a one-way system finishes. Don't stray over the centre line."},
{"c":"signs","s":"narrows","q":"What does this warning sign mean?","o":["Road narrows on both sides","Road widens","Bridge ahead","Two-way traffic"],"a":0,"e":"Be ready to give way or slow down — there may not be room for two vehicles side by side."},
{"c":"signs","s":"no_stopping","q":"What does this sign mean?","o":["No stopping — a clearway","No waiting","No parking on the verge","End of restriction"],"a":0,"e":"You must not stop at all, even to drop someone off, except in an emergency."},
{"c":"signs","s":"no_waiting","q":"What does this sign mean?","o":["No waiting","No stopping at any time","Parking permitted","No entry"],"a":0,"e":"You may stop briefly to set down or pick up passengers, but you can't wait or park."},
{"c":"signs","s":"one_way","q":"What does this sign mean?","o":["One-way street in the direction of the arrow","Traffic merges from the right","Keep right","Ahead only"],"a":0,"e":"Rectangular signs give information. Don't confuse this with the blue 'ahead only' circle, which is an order."},
{"c":"signs","q":"What shape are signs that give an order you must obey?","o":["Circular","Triangular","Rectangular","Octagonal"],"a":0,"e":"Circles order, triangles warn, rectangles inform. A red ring means don't; a blue circle means do."},
{"c":"signs","q":"What colour are motorway direction signs?","o":["Blue with white lettering","Green with white lettering","White with black lettering","Brown with white lettering"],"a":0,"e":"Green signs are primary routes, white with black borders are local roads, and brown signs point to tourist attractions."},
{"c":"signs","q":"You see a temporary road sign with a yellow background. What does that mean?","o":["It's a temporary sign, often for roadworks or an event","It's advisory only","It applies to lorries only","It applies at night only"],"a":0,"e":"Yellow-backed signs still carry the same legal force as the permanent version when they show an order."},
{"c":"signs","q":"What does a triangular sign with a red border warn of?","o":["A hazard ahead","An order you must obey","Information about a route","The end of a restriction"],"a":0,"e":"The picture inside tells you what the hazard is, and any plate underneath adds distance or detail."},
{"c":"signs","q":"What does a white sign with a red border and a number inside a circle mean?","o":["A maximum speed limit you must not exceed","A recommended speed","A minimum speed","A distance in miles"],"a":0,"e":"It applies until you see a different limit sign. Repeater signs along the road confirm it."},
{"c":"signs","q":"What does a zig-zag line on the approach to a pedestrian crossing mean?","o":["No parking or overtaking within the zig-zag area","Give way to traffic from the right","Cyclists only","The road narrows"],"a":0,"e":"The zig-zags keep the crossing visible. Parking or overtaking there hides pedestrians from other drivers."},
{"c":"signs","q":"What does a blue circle with a white bicycle mean?","o":["A route for cycles only","No cycling","Cycles may be present","Cycle parking"],"a":0,"e":"Blue circle means mandatory. If it's a red-ringed bicycle, cycling is prohibited."},
{"c":"signs","q":"What does an arm signal — right arm extended and moving up and down — from a driver mean?","o":["I intend to slow down or stop","I intend to turn right","I intend to move off","I am letting you pass"],"a":0,"e":"Arm signals matter where indicators might be missed, such as at a crossing or when a bulb has failed."},
{"c":"signs","q":"What does a red flashing light signal at a level crossing mean?","o":["Stop — a train is approaching","Proceed slowly","The barrier is broken","Give way to pedestrians"],"a":0,"e":"If the lights keep flashing after a train has gone, another one is coming. Stay put until they stop."},
{"c":"signs","q":"You see a sign with a brown background. What does it point to?","o":["A tourist attraction","A motorway service area","A diversion route","A weight restriction"],"a":0,"e":"Brown means leisure and tourism. Blue means motorway, green means primary route, white means local road."},
{"c":"signs","q":"What does a lane marking of double yellow lines at the kerb mean?","o":["No waiting at any time","No stopping at any time","Loading only","Parking for permit holders"],"a":0,"e":"Double yellows ban waiting, but you can usually load or unload unless there are kerb blips showing loading restrictions."},
{"c":"alertness","q":"You're driving and a wasp flies into the car. What should you do?","o":["Stop in a safe place and deal with it","Swat at it while driving","Open the window and keep driving fast","Brake hard to distract it"],"a":0,"e":"Any distraction inside the car is a hazard. Pull over somewhere safe and legal before dealing with it."},
{"c":"alertness","q":"When is it safe to eat or drink at the wheel?","o":["It isn't — stop somewhere safe if you need to","At traffic lights","On a straight, empty road","In slow-moving traffic"],"a":0,"e":"You need both hands and full attention. Spilling a hot drink in your lap at 40mph is how people lose control."},
{"c":"alertness","q":"You're driving a long distance. How often should you take a break?","o":["At least every two hours","Every five hours","Only when you feel exhausted","Only if you're over 70"],"a":0,"e":"A break of at least 15 minutes every two hours is the advice. Tiredness builds long before you notice it."},
{"c":"alertness","q":"Before changing lanes on a dual carriageway, what should you do?","o":["Mirrors, signal, then a blind-spot check before moving","Signal, move over, then check your mirrors","Check your mirrors and move if it looks clear","Move over gradually so other drivers notice"],"a":0,"e":"A vehicle can sit in your blind spot for miles. The shoulder check is what catches it."},
{"c":"alertness","q":"Why should you take extra care when driving somewhere completely new to you?","o":["You'll be navigating as well as driving, which splits your attention","The roads are more dangerous","Speed limits are different","Your insurance may not cover it"],"a":0,"e":"Plan the route beforehand, and if you're unsure, pull over somewhere safe to check rather than reading signs at the last second."},
{"c":"alertness","q":"You've just been overtaken and the car has pulled in close in front. What should you do?","o":["Ease off to restore your safety gap","Brake firmly to open a gap quickly","Stay close so nobody else can pull in","Move out and overtake them back"],"a":0,"e":"Ease off gently and rebuild the gap. Retaliating turns one bad bit of driving into two."},

{"c":"attitude","q":"You're driving a slow vehicle on a narrow road with a long queue behind. What should you do?","o":["Pull over where it's safe and let them pass","Keep going and let them overtake when they can","Wave them past when the road looks clear","Speed up until the queue clears"],"a":0,"e":"The Highway Code asks slower drivers to pull in where possible. A frustrated queue is a queue full of risky overtakes."},

{"c":"attitude","q":"You're waiting to turn right and traffic is building up behind you. What should you do?","o":["Wait for a safe gap, however long it takes","Take the next small gap","Pull out and make them stop","Reverse and go another way"],"a":0,"e":"Pressure from behind is not a reason to accept an unsafe gap. It's your licence and your responsibility."},
{"c":"attitude","q":"Why shouldn't you drive with your front fog lights on in clear weather?","o":["They dazzle other drivers unnecessarily","They use too much fuel","They're illegal on all roads","They damage the bulbs"],"a":0,"e":"Same as rear fogs — they exist for seriously reduced visibility and should be switched off as soon as it clears."},
{"c":"attitude","q":"A cyclist has pulled into the middle of the lane ahead of you at a narrow pinch point. What should you do?","o":["Hold back until the road is wide enough to pass safely","Pass them within the lane, keeping well left","Move up close so they know you want past","Expect them to move over once you signal"],"a":0,"e":"Riders take the centre of the lane where there isn't room to be passed safely. Wait for the road to open up."},
{"c":"vehicle","q":"What does a red warning light on the dashboard usually mean?","o":["Something serious — stop as soon as it's safe and investigate","It's advisory only","It relates to the radio","It will clear itself"],"a":0,"e":"Red means stop and check; amber generally means get it looked at soon. Check the handbook for the specific symbol."},
{"c":"vehicle","q":"How can you tell if your shock absorbers are worn?","o":["The car continues to bounce after you press down on a corner","The steering wheel is stiff","The engine is noisy","The brakes squeal"],"a":0,"e":"Worn dampers let the wheels lose contact with the road, which affects braking, cornering and grip."},
{"c":"vehicle","q":"Why should you check your mirrors and seat position before starting a journey?","o":["So you can see clearly and reach the controls comfortably","To save fuel","To reduce tyre wear","To satisfy the MOT"],"a":0,"e":"Adjust the seat first, then the mirrors to match. Never do either while the car is moving."},
{"c":"vehicle","q":"What's the effect of under-inflated tyres?","o":["Poorer handling, longer stopping distances and more fuel used","Better grip in the wet","Shorter stopping distances","No effect below 40mph"],"a":0,"e":"They also wear out faster on the shoulders and are more likely to overheat and blow out at speed."},
{"c":"vehicle","q":"When should you switch off your engine while waiting?","o":["If you're likely to be stationary for more than a couple of minutes","Only when parked on private land","Every time you stop at traffic lights","Only once the engine is fully warmed up"],"a":0,"e":"Idling wastes fuel and pollutes, and leaving an engine running unnecessarily on a public road is an offence."},
{"c":"vehicle","q":"What's the most likely cause of the brakes pulling to one side?","o":["A fault in the braking system that needs checking","Worn wiper blades","Low screen wash","A dirty windscreen"],"a":0,"e":"Uneven braking is dangerous under hard stops. Get it diagnosed rather than driving around it."},
{"c":"vehicle","q":"Where is the safest place for a rear-facing baby seat?","o":["In the back, or in the front only if the airbag is deactivated","Front seat with the airbag active","On the parcel shelf","On a passenger's lap"],"a":0,"e":"A deploying airbag can be fatal to a rear-facing infant. If you must use the front, the airbag has to be switched off."},

{"c":"margins","q":"What's the overall stopping distance at 50mph in good conditions?","o":["53 metres (about 175 feet)","36 metres (about 118 feet)","73 metres (about 240 feet)","23 metres (about 75 feet)"],"a":0,"e":"15m thinking plus 38m braking. Notice how it grows far faster than the speed does."},

{"c":"margins","q":"Which part of the stopping distance is affected by tiredness or distraction?","o":["The thinking distance","The braking distance","Neither","Both equally"],"a":0,"e":"Reaction time stretches, so you travel further before the brakes even come on. Tyres and road surface affect the braking part."},
{"c":"margins","q":"How much can stopping distances increase on an icy road?","o":["Up to ten times the normal distance","Twice the normal distance","They stay the same","Half the normal distance"],"a":0,"e":"On ice you need an enormous gap and feather-light inputs. Even then, stopping may simply not be possible."},
{"c":"margins","q":"You're overtaking on a country road and the vehicle ahead speeds up. What should you do?","o":["Drop back and abandon the overtake","Keep accelerating to complete the move","Hold position alongside until they slow","Move back in front of them quickly"],"a":0,"e":"Never commit to an overtake you can't finish. Back off and wait for a better opportunity."},
{"c":"margins","q":"Why should you leave extra space when following a large vehicle in the rain?","o":["Spray from its wheels badly reduces your visibility","It brakes much harder","It accelerates faster","It has no brake lights"],"a":0,"e":"You also need the extra distance to see round it. If you can't see the road ahead, you can't plan."},

{"c":"margins","q":"What should you do if your tyre blows out at speed?","o":["Hold the steering firmly, ease off the accelerator and slow gradually","Brake hard immediately","Steer sharply to the verge","Pull the handbrake"],"a":0,"e":"Let the car slow itself, keep it straight, and pull off the road well clear of traffic when you can."},
{"c":"hazard","q":"You see a cyclist ahead glance over their right shoulder. What might this mean?","o":["They may be about to move out or turn right","They're checking the road surface behind them","They want you to overtake","They're about to stop at the kerb"],"a":0,"e":"A shoulder check is usually the first sign of a manoeuvre. Hang back and give them room."},
{"c":"hazard","q":"What should you do when approaching a humpback bridge?","o":["Slow down and be ready for oncoming traffic you can't see","Keep to the centre of the road and hold your speed","Accelerate so you're over it quickly","Move to the crown of the bridge before looking"],"a":0,"e":"You have no view of the far side, and the road may be single track over the bridge itself."},

{"c":"hazard","q":"Why are junctions on a hill particularly hazardous?","o":["Your view may be restricted and vehicles can roll back","Gears wear faster","Brakes fail on hills","Signals don't work uphill"],"a":0,"e":"Leave extra room behind a car doing a hill start, and creep forward carefully if a crest hides your view."},
{"c":"hazard","q":"You feel unwell but you're already driving. What should you do?","o":["Stop somewhere safe as soon as you can","Continue slowly to your destination","Open a window and carry on","Pull onto the hard shoulder and rest"],"a":0,"e":"Feeling faint, dizzy or in pain will slow your reactions. Get off the road before it becomes an emergency."},
{"c":"hazard","q":"What should you expect where the road is marked with a sign warning of queues ahead?","o":["Traffic may be stopped just out of sight","The road is closed","There are roadworks only","The speed limit has ended"],"a":0,"e":"Slow early and consider a brief flash of hazard lights to warn the driver behind you."},
{"c":"vulnerable","q":"What should you do before opening your car door after parking on the road?","o":["Check mirrors and over your shoulder for cyclists and traffic","Open it quickly","Rely on your mirrors alone","Open it and listen"],"a":0,"e":"The 'Dutch reach' — opening with the hand furthest from the door — turns your body and forces the check naturally."},

{"c":"vulnerable","q":"A vehicle displaying a disabled badge is parked awkwardly ahead. What should you do?","o":["Be patient — the driver may need more time and space","Pass close so you don't block the road","Wait behind and give a short horn note","Expect them to move as soon as they see you"],"a":0,"e":"Getting in and out may take a while. Give them room and wait."},

{"c":"vulnerable","q":"You're approaching a pedestrian crossing and a bus is stopped in the lane beside you. What should you do?","o":["Slow down — someone may step out from in front of the bus","Pass the bus quickly while the crossing is clear","Hold your speed but watch the bus's mirrors","Expect the bus to move off before you reach it"],"a":0,"e":"Your view is blocked, so treat the gap as if someone is about to walk out of it."},

{"c":"others","q":"You're approaching a school bus with hazard lights on. What should you do?","o":["Slow down and watch for children getting off","Pass quickly while the bus is stationary","Expect the bus to move off immediately","Treat it as an ordinary parked vehicle"],"a":0,"e":"Children crossing in front of or behind a bus is one of the most common school-run collisions."},

const TOTAL = BANK.length;
const KEY = 'dante-theory-v1';
let S = {
  xp:0, seen:{}, wrongIds:[], streak:0, lastDay:null,
  mocks:[], badges:[], testDate:null, totalAnswered:0, totalRight:0
};
let memoryOnly = false;

const hasClaudeStore = typeof window.storage === 'object' && window.storage !== null
                    && typeof window.storage.get === 'function';
async function load(){
  try{
    let raw = null;
    if(hasClaudeStore){
      const r = await window.storage.get(KEY);
      raw = r && r.value;
    }else{
      raw = window.localStorage.getItem(KEY);
    }
    if(raw) S = Object.assign(S, JSON.parse(raw));
  }catch(e){ /* first run, or storage blocked */ }
  touchStreak();
}
async function save(){
  if(memoryOnly) return;
  try{
    const raw = JSON.stringify(S);
    if(hasClaudeStore) await window.storage.set(KEY, raw);
    else window.localStorage.setItem(KEY, raw);
  }catch(e){ memoryOnly = true; }
}
function today(){ return new Date().toISOString().slice(0,10); }
function touchStreak(){
  const t = today();
  if(S.lastDay === t) return;
  const y = new Date(Date.now()-86400000).toISOString().slice(0,10);
  S.streak = (S.lastDay === y) ? S.streak+1 : 1;
  S.lastDay = t;
  save();
}

/* ---------- derived numbers ---------- */
const RANKS = [
  {xp:0,    name:'Provisional'},
  {xp:250,  name:'L-Plater'},
  {xp:700,  name:'Junction Handler'},
  {xp:1400, name:'Sign Reader'},
  {xp:2300, name:'Motorway Merger'},
  {xp:3400, name:'Hazard Hunter'},
  {xp:4800, name:'Test Ready'},
  {xp:6500, name:'Full Licence'}
];
function rank(){
  let i=0; for(let k=0;k<RANKS.length;k++) if(S.xp>=RANKS[k].xp) i=k;
  const cur=RANKS[i], nxt=RANKS[i+1];
  const pct = nxt ? Math.round(((S.xp-cur.xp)/(nxt.xp-cur.xp))*100) : 100;
  return {name:cur.name, next:nxt?nxt.name:null, need:nxt?nxt.xp-S.xp:0, pct};
}
function masteredCount(){ return Object.values(S.seen).filter(v=>v.r>0).length; }
function readiness(){ return Math.round((masteredCount()/TOTAL)*100); }
function accuracy(){ return S.totalAnswered ? Math.round((S.totalRight/S.totalAnswered)*100) : 0; }
function catStats(c){
  const ids = BANK.map((q,i)=>[q,i]).filter(x=>x[0].c===c).map(x=>x[1]);
  const done = ids.filter(i=>S.seen[i] && S.seen[i].r>0).length;
  return {total:ids.length, done, pct: Math.round((done/ids.length)*100), ids};
}
function daysToTest(){
  if(!S.testDate) return null;
  const d = Math.ceil((new Date(S.testDate+'T12:00') - new Date())/86400000);
  return d;
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  if(d===1) return 'Test is tomorrow';
  return d + ' days until your test';

function gauge(pct){
  const SEG = 34, lit = Math.round(SEG*pct/100);
  let segs = '';
  for(let i=0;i<SEG;i++){
    const a = (-90 + (i+.5)*(180/SEG))*Math.PI/180;
    const inr = 92, out = i%4===0 ? 116 : 110;
    const x1=150+Math.sin(a)*inr, y1=150-Math.cos(a)*inr;
    const x2=150+Math.sin(a)*out, y2=150-Math.cos(a)*out;
    const t = i/(SEG-1);
    const col = `rgb(${Math.round(63+(46-63)*t)},${Math.round(208+(230-208)*t)},${Math.round(255+(168-255)*t)})`;
    segs += `<line class="seg" data-c="${col}" data-on="${i<lit?1:0}"
      x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
      stroke="rgba(110,160,215,.20)" stroke-width="${i%4===0?5:3.4}" stroke-linecap="round"
      style="transition:stroke .3s ease ${i*16}ms, filter .3s ease ${i*16}ms"/>`;
  }
  return `<div class="gaugewrap">
    <svg class="gauge" viewBox="0 0 300 186" aria-label="Test readiness ${pct} per cent">
      <path d="M44 150 A106 106 0 0 1 256 150" fill="none" stroke="rgba(96,178,255,.10)" stroke-width="1.5"/>
      <path d="M62 150 A88 88 0 0 1 238 150" fill="none" stroke="rgba(96,178,255,.07)" stroke-width="1"/>
      ${segs}
      <g id="needle" transform="rotate(-90 150 150)" style="transition:transform 1.1s cubic-bezier(.2,.8,.2,1)">
        <path d="M150 74 L143 87 H157 Z" fill="#ffc447" style="filter:drop-shadow(0 0 6px rgba(255,196,71,.9))"/>
      </g>
    </svg>
    <div class="gaugeval"><div class="pct">${pct}<i>%</i></div></div>
  </div>`;
}
function sweepGauge(pct){
  const segs = document.querySelectorAll('.seg'), needle = document.getElementById('needle');
  requestAnimationFrame(()=>{
    segs.forEach(el=>{
      if(el.dataset.on==='1'){
        el.setAttribute('stroke', el.dataset.c);
        el.style.filter = 'drop-shadow(0 0 5px '+el.dataset.c+')';
      }
    });
    if(needle) needle.setAttribute('transform', `rotate(${-90+pct*1.8} 150 150)`);
  });
}

        <span class="ico">🏅</span><span><b>Achievements</b><span>${S.badges.length} of ${BADGES.length} unlocked</span></span></button>
      <button class="tile" onclick="renderSettings()">
        <span class="ico">⚙️</span><span><b>Test date and progress</b><span>Set the countdown or reset everything</span></span></button>
    </div>
    <p class="small mute" style="margin-top:18px">${S.mocks.length ? 'Last mock: '+S.mocks[S.mocks.length-1]+'/50' : 'No mock test attempted yet. Do one this week.'}</p>
    <div class="foot">
      <b style="color:var(--ice);font-weight:600">Read this before you rely on it.</b>
      These are original questions written from The Highway Code and Know Your Traffic Signs.
      They cover the same 14 DVSA topics in roughly the same proportions as the real test, but they
      are <b style="color:var(--ice);font-weight:600">not</b> the official DVSA questions and this site
      isn't connected to the DVSA. Use it to learn the rules, then check yourself against the official
      DVSA app, which uses the licensed question bank and includes the hazard perception clips this site can't.
      Aim for 48+ here before you book.
    </div>`;
  show('s-home');
  sweepGauge(pct);
}

function renderTopics(){
  const rows = Object.keys(CATS).map(c=>{
    const st = catStats(c);
    const dash = 2*Math.PI*15;
    return `<button class="topic" onclick="startTopic('${c}')">
      <svg class="ring" width="38" height="38" viewBox="0 0 38 38" aria-hidden="true">
        <circle cx="19" cy="19" r="15" fill="none" stroke="rgba(96,178,255,.16)" stroke-width="4"/>
        <circle cx="19" cy="19" r="15" fill="none" stroke="${st.pct>=80?'#2ee6a8':'#3fd0ff'}" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="${(dash*st.pct/100).toFixed(1)} ${dash}" transform="rotate(-90 19 19)"/>
      </svg>
      <span class="tx"><b>${CATS[c].emoji} ${CATS[c].name}</b><span>${st.done}/${st.total} correct · ${st.pct}%</span></span>
      <span class="mute">›</span></button>`;
  }).join('');
  document.getElementById('s-topics').innerHTML =
    `<button class="back" onclick="renderHome()">‹ Back</button>
     <h2>Pick a topic</h2>
     <p class="mute small">The ring fills as you get each question right at least once.</p>
     <div style="margin-top:8px">${rows}</div>`;
  show('s-topics');
}

function renderBadges(){
  const cards = BADGES.map(b=>`
    <div class="badge ${S.badges.includes(b.id)?'won':''}">
      <div class="em">${b.em}</div><b>${b.name}</b><span>${b.desc}</span></div>`).join('');
  document.getElementById('s-badges').innerHTML =
    `<button class="back" onclick="renderHome()">‹ Back</button>
     <h2>Achievements</h2>
     <p class="mute small">${S.badges.length} of ${BADGES.length} unlocked.</p>
     <div class="ach">${cards}</div>`;
  show('s-badges');
}

function renderSettings(){
  document.getElementById('s-settings').innerHTML =
    `<button class="back" onclick="renderHome()">‹ Back</button>
     <h2>Test date and progress</h2>
     <p class="mute small">Set the date and the dashboard counts down to it.</p>
     <input type="date" id="dateIn" value="${S.testDate||''}">
     <button class="btn" onclick="saveDate()">Save test date</button>
     <p class="mute small" style="margin-top:26px">Starting again wipes your XP, streak, badges and weak spots. There's no undo.</p>
     <button class="btn ghost" onclick="wipe()">Reset all progress</button>
     ${memoryOnly?'<p class="small mute" style="margin-top:20px">Progress can\'t be saved in this session, so it will only last until you close the page.</p>':''}`;
  show('s-settings');
}
function saveDate(){
  S.testDate = document.getElementById('dateIn').value || null;
  save(); toast('Test date saved'); renderHome();
}
async function wipe(){
  S = {xp:0, seen:{}, wrongIds:[], streak:1, lastDay:today(), mocks:[], badges:[], testDate:null, totalAnswered:0, totalRight:0};
  await save(); toast('Progress reset'); renderHome();
}

/* =======================================================================
   QUIZ ENGINE
   ======================================================================= */
let Q = null;  // {ids, i, mode, label, picks:[], answered:bool, endsAt, timer}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function allIds(){ return BANK.map((q,i)=>q.cs?-1:i).filter(i=>i>=0); }

function begin(ids, mode, label){
  if(!ids.length){ toast('Nothing to practise here yet'); return; }
  Q = {ids, i:0, mode, label, picks:new Array(ids.length).fill(null), answered:false, endsAt:null, timer:null,
       orders: ids.map(id => shuffle(BANK[id].o.map((_,k)=>k)))};
  if(mode==='mock'){
    Q.endsAt = Date.now() + 57*60*1000;
    Q.timer = setInterval(tick, 1000);
  }
  drawQ();
  show('s-quiz');
}
function startQuick(){ begin(shuffle(allIds()).slice(0,10), 'practice', 'Quick 10'); }
function startTopic(c){ begin(shuffle(catStats(c).ids), 'practice', CATS[c].name); }
function startSigns(){ begin(shuffle(BANK.map((q,i)=>q.s?i:-1).filter(i=>i>=0)), 'practice', 'Sign lab'); }
function startWeak(){
  if(!S.wrongIds.length){ toast('No weak spots. Keep it that way.'); return; }
  begin(shuffle(S.wrongIds).slice(0,20), 'weak', 'Weak spots');
}
/* The real test doesn't sample topics evenly — signs, rules of the road, hazard
   awareness and safety margins carry the most questions, while documents and
   vehicle loading usually contribute one or two. This mirrors that spread. */
const MOCK_WEIGHTS = {signs:7, rules:6, hazard:5, margins:4, vulnerable:4, motorway:4,
                      vehicle:3, handling:3, alertness:3, attitude:2, others:2,
                      incidents:2, docs:1, loading:1};
function startMock(){
  let picked = [];
  for(const c in MOCK_WEIGHTS){
    const pool = BANK.map((q,i)=>(q.c===c && !q.cs) ? i : -1).filter(i=>i>=0);
    picked = picked.concat(shuffle(pool).slice(0, MOCK_WEIGHTS[c]));
  }
  picked = shuffle(picked);
  // the scenario questions come last, as the video-clip questions do in the real test
  const caseId = shuffle(Object.keys(CASES))[0];
  const caseQs = BANK.map((q,i)=>q.cs===caseId ? i : -1).filter(i=>i>=0);
  begin(picked.slice(0, 50-caseQs.length).concat(caseQs), 'mock', 'Mock test');
}

function tick(){
  const left = Q.endsAt - Date.now();
  const el = document.getElementById('clock');
  if(!el) return;
  if(left<=0){ clearInterval(Q.timer); finish(); return; }
  const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
  el.textContent = m+':'+String(s).padStart(2,'0');
  el.classList.toggle('warn', left < 5*60000);
}

function isMulti(q){ return Array.isArray(q.a); }
function sameSet(a,b){
  if(!Array.isArray(a)||!Array.isArray(b)||a.length!==b.length) return false;
  const x=a.slice().sort(), y=b.slice().sort();
  return x.every((v,i)=>v===y[i]);
}
function wasRight(n){
  const q = BANK[Q.ids[n]], p = Q.picks[n];
  return isMulti(q) ? sameSet(p, q.a) : p===q.a;
}

function drawQ(){
  const id = Q.ids[Q.i], q = BANK[id], mock = Q.mode==='mock', multi = isMulti(q);
  const letters = ['A','B','C','D'], ord = Q.orders[Q.i];
  const opts = ord.map((orig,k)=>`
    <button class="opt" id="o${k}" onclick="pick(${k})">
      <span class="k">${letters[k]}</span><span>${esc(q.o[orig])}</span></button>`).join('');
  const cse = q.cs ? CASES[q.cs] : null;
  document.getElementById('s-quiz').innerHTML = `
    <div class="qhead">
      <span class="meta">${esc(Q.label)} · ${Q.i+1} of ${Q.ids.length}${mock?` · ${Q.picks.filter(p=>p!==null).length} answered`:''}</span>
      ${mock ? `<span style="display:flex;align-items:center;gap:12px">
                  <button class="back" style="margin:0;padding:0" onclick="abandon()">Abandon</button>
                  <span class="clock" id="clock">57:00</span></span>`
             : `<button class="back" style="margin:0;padding:0" onclick="quit()">Quit</button>`}
    </div>
    <div class="prog"><i style="width:${(Q.i/Q.ids.length*100)}%"></i></div>
    ${cse ? `<div class="scenario"><b>${esc(cse.title)}</b>${esc(cse.text)}</div>` : ''}
    ${q.s ? `<div class="signbox">${signSVG(q.s)}</div>` : ''}
    <p class="qtext">${esc(q.q)}</p>
    ${multi ? `<p class="pick">Mark ${q.m===2?'two':q.m} answers</p>` : ''}
    <div class="opts">${opts}</div>
    <div id="feedback"></div>
    ${mock ? `<div class="sticky"><div class="row">
        ${Q.i>0?'<button class="btn ghost" onclick="prev()">Previous</button>':''}
        <button class="btn${Q.i===Q.ids.length-1?' go':' ghost'}" onclick="skip()">${Q.i===Q.ids.length-1?'Finish test':'Next question'}</button>
      </div></div>` : ''}`;
  Q.answered = false;
  if(mock && Q.picks[Q.i]!==null){
    const chosen = multi ? Q.picks[Q.i] : [Q.picks[Q.i]];
    chosen.forEach(orig=>{
      const d = ord.indexOf(orig);
      if(d>-1) document.getElementById('o'+d).classList.add('sel');
    });
  }
  if(mock) tick();
}

function pick(k){
  const id = Q.ids[Q.i], q = BANK[id], ord = Q.orders[Q.i], chosen = ord[k];
  const mock = Q.mode==='mock', multi = isMulti(q);

  if(multi){
    if(Q.answered) return;
    let cur = Array.isArray(Q.picks[Q.i]) ? Q.picks[Q.i].slice() : [];
    const at = cur.indexOf(chosen);
    if(at>-1) cur.splice(at,1); else cur.push(chosen);
    while(cur.length > q.m) cur.shift();
    Q.picks[Q.i] = cur.length ? cur : null;
    ord.forEach((orig,j)=>document.getElementById('o'+j).classList.toggle('sel', cur.includes(orig)));
    if(!mock && cur.length===q.m) reveal(q, ord, cur);
    return;
  }

  if(mock){
    Q.picks[Q.i]=chosen;
    for(let j=0;j<ord.length;j++) document.getElementById('o'+j).classList.toggle('sel', j===k);
    return;
  }
  if(Q.answered) return;
  Q.picks[Q.i]=chosen;
  reveal(q, ord, chosen);
}

function reveal(q, ord, picked){
  Q.answered = true;
  const multi = isMulti(q);
  const correct = multi ? q.a : [q.a];
  const chosen = multi ? picked : [picked];
  const right = multi ? sameSet(picked, q.a) : picked===q.a;
  ord.forEach((orig,j)=>{
    const el = document.getElementById('o'+j);
    el.disabled = true; el.classList.remove('sel');
    if(correct.includes(orig)) el.classList.add('right');
    else if(chosen.includes(orig)) el.classList.add('wrong');
  });
  record(Q.ids[Q.i], right);
  const label = right ? 'Correct'
    : multi ? 'Not quite — the correct answers are shown in green'
            : 'Not quite — the answer is ' + ['A','B','C','D'][ord.indexOf(q.a)];
  document.getElementById('feedback').innerHTML = `
    <div class="why ${right?'ok':'no'}"><b>${label}</b>${esc(q.e)}</div>
    <button class="btn ${right?'go':''}" onclick="next()">${Q.i===Q.ids.length-1?'See results':'Next question'}</button>`;
  const fb = document.getElementById('feedback');
  if(fb.scrollIntoView) fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function record(id, right){
  S.seen[id] = S.seen[id] || {r:0,w:0};
  S.totalAnswered++;
  if(right){
    const first = S.seen[id].r===0;
    S.seen[id].r++; S.totalRight++;
    S.xp += first ? 10 : 4;
    const at = S.wrongIds.indexOf(id);
    if(at>-1){
      S.wrongIds.splice(at,1);
      S.fixed = (S.fixed||0)+1;
      if(S.fixed>=10) award('redeemed');
    }
  }else{
    S.seen[id].w++;
    if(!S.wrongIds.includes(id)) S.wrongIds.push(id);
  }
  if(S.totalAnswered>=10) award('ignition');
  if(S.totalAnswered>=100) award('century');
  if(S.totalAnswered>=300) award('grinder');
  if(S.streak>=3) award('streak3');
  if(S.streak>=7) award('streak7');
  save();
}

function next(){ if(Q.i<Q.ids.length-1){ Q.i++; drawQ(); } else finish(); }
function skip(){ if(Q.i<Q.ids.length-1){ Q.i++; drawQ(); } else finish(); }
function prev(){ if(Q.i>0){ Q.i--; drawQ(); } }
function quit(){ if(Q&&Q.timer) clearInterval(Q.timer); Q=null; renderHome(); }
function abandon(){
  const done = Q.picks.filter(p=>p!==null).length;
  if(confirm('Abandon the mock? '+done+' of '+Q.ids.length+' answered. Nothing will be scored.')) quit();
}

/* =======================================================================
   RESULTS
   ======================================================================= */
function finish(){
  if(Q.timer) clearInterval(Q.timer);
  const mock = Q.mode==='mock';
  let score = 0;
  const byCat = {};
  Q.ids.forEach((id,n)=>{
    const q = BANK[id], right = wasRight(n);
    if(mock) record(id, right);
    if(right) score++;
    byCat[q.c] = byCat[q.c] || {r:0,t:0};
    byCat[q.c].t++; if(right) byCat[q.c].r++;
  });
  const total = Q.ids.length;
  const pass = mock ? score>=43 : score/total>=0.86;

  if(mock){
    S.mocks.push(score);
    if(score>=43){ S.xp += 100; award('boss'); }
    if(score>=48) award('ace');
  }else if(score===total && total>=8){
    award(Q.label==='Sign lab' ? 'signs' : 'flawless');
  }
  save();

  const missed = Q.ids.map((id,n)=>({id,n})).filter(x=>!wasRight(x.n));
  const review = missed.map(x=>{
    const q = BANK[x.id];
    return `<div style="border-bottom:1px solid rgba(96,178,255,.14);padding:12px 0">
      ${q.s?`<div style="width:60px;margin-bottom:6px">${signSVG(q.s)}</div>`:''}
      <div style="font-weight:600">${esc(q.q)}</div>
      <div class="small" style="color:var(--go);margin-top:4px">Answer: ${esc(isMulti(q)? q.a.map(i=>q.o[i]).join(' + ') : q.o[q.a])}</div>
      <div class="small mute" style="margin-top:2px">${esc(q.e)}</div></div>`;
  }).join('');

  const rows = Object.keys(byCat).map(c=>{
    const b = byCat[c], p = Math.round(b.r/b.t*100);
    return `<div class="brow"><span style="width:26px">${CATS[c].emoji}</span>
      <span class="nm">${CATS[c].name}</span>
      <span class="bar"><i style="width:${p}%;background:${p>=80?'var(--go)':p>=50?'var(--amber)':'var(--stop)'};box-shadow:0 0 8px currentColor"></i></span>
      <span class="n">${b.r}/${b.t}</span></div>`;
  }).join('');

  let verdictWord, note;
  if(mock){
    verdictWord = pass ? 'PASS' : 'NOT YET';
    note = pass
      ? (score>=48 ? 'That would have been a comfortable pass. Do another one in a couple of days to prove it wasn\'t luck.'
                   : 'Over the line. Keep mocking until you\'re clearing 46+ every time.')
      : 'You needed 43. Everything you missed is now sitting in your weak spots — go clear it, then run this again.';
  }else{
    verdictWord = score===total ? 'CLEAN SWEEP' : score/total>=0.86 ? 'SOLID' : 'NEEDS WORK';
    note = score===total ? 'Nothing missed. Pick a harder topic.'
         : 'Anything you got wrong is in your weak spots now.';
  }

  document.getElementById('s-result').innerHTML = `
    <div class="verdict">
      <div class="big ${mock?(pass?'pass':'fail'):''}">${score}<span>/${total}</span></div>
      <div class="word ${mock?(pass?'pass':'fail'):''}">${verdictWord}</div>
      ${mock?`<p class="mute small">Pass mark is 43 out of 50 · ${Math.round(score/total*100)}%</p>`:''}
    </div>
    <p>${note}</p>
    <div class="breakdown"><h3 style="margin-bottom:6px">How it broke down</h3>${rows}</div>
    ${missed.length?`<h3 style="margin-top:24px">What you missed (${missed.length})</h3>${review}`:''}
    <div class="row" style="margin-top:20px">
      <button class="btn ghost" onclick="renderHome()">Home</button>
      <button class="btn" onclick="${mock?'startMock()':'startWeak()'}">${mock?'Another mock':'Fix weak spots'}</button>
    </div>`;
  Q = null;
  show('s-result');
}

/* =======================================================================
   GO
   ======================================================================= */
(async function(){
  await load();
  renderHome();
  fillSplash();
})();
</script>
